<!--
  Password-recovery mail for the LOCAL stack.

  It exists because of a contract, not for decoration. The default template links to
  `{auth external url}/auth/v1/verify?token={hash}&type=recovery&redirect_to=…`, and following
  that link SPENDS the single-use hash: the provider verifies it, then redirects to the
  application with an access token in the URL fragment. RootLco completes a reset the other way
  round — `POST /api/v1/auth/password-reset/completion` hands the token to the provider's
  `verifyOtp({ token_hash, type })` (apps/api/src/modules/iam/provider/supabase-provider.ts) —
  so by the time the reader reaches the page, the only credential the API can use has already
  been consumed, and every completion is refused. Measured on this stack 2026-09-19.

  So the link is addressed to the application directly and carries the hash itself. The page
  reads it from the `token` query parameter (tokenFromQuery in
  apps/web/src/features/authentication/api/recovery-token.ts), erases it from the address bar,
  and spends it once on submit.

  `.SiteURL` is the web origin configured in supabase/config.toml. The path is locale-prefixed
  because every application route is; `en` is the local default.
-->
<h2>Reset your password</h2>

<p>Open the link below to choose a new password. It can be used once and it expires.</p>

<p>
  <a href="{{ .SiteURL }}/en/reset-password?token={{ .TokenHash }}&amp;type=recovery"
    >Choose a new password</a
  >
</p>

<p>
  If you did not ask for this, nothing has changed and you can ignore this message. A password
  changes only when someone opens the link and sets one.
</p>
