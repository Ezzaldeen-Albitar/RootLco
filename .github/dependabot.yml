# =============================================================================
# RootLco — Dependabot.
#
# The repository had no dependabot.yml at all, on a PUBLIC repository whose
# production dependency tree carried three HIGH advisories at the audit
# baseline (CSA-08). Nothing was watching.
#
# Grouped deliberately. Ungrouped Dependabot on a tree this size opens a dozen
# pull requests a week, each burning a full CI gate, and the result is that
# people stop reading them — which is worse than not having it.
#
# Every Dependabot pull request runs the SAME `pr-ci.yml` gate as a human one.
# There is no auto-merge anywhere in this configuration: not for majors, and not
# for security fixes either, because a security fix that breaks the build is
# still a broken build.
# =============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Amman
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    # VERSION updates target the working branch, so Dependabot never proposes a
    # promotion to `main` — that is a founders' reserved decision (ADR-006).
    #
    # This comment previously said "Security updates target the working branch,
    # never `main`", which is BACKWARDS. `target-branch` is documented as
    # version-updates-only, and when it is set: "Options defined for this
    # `package-ecosystem` no longer apply to security updates because security
    # updates always use the default branch for the repository." This
    # repository's default branch IS `main`. So a Dependabot SECURITY update for
    # npm targets `main`, and arrives with none of this block's `labels`,
    # `commit-message`, `groups`, `ignore` or `open-pull-requests-limit`
    # applied. That is a real interaction with ADR-006 and is recorded as an
    # open question for the owner in
    # docs/engineering/dependency-maintenance/pre-p1-23/final-reconciliation.md;
    # it is NOT changed here, because changing it changes behaviour.
    target-branch: develop
    groups:
      # One pull request for the framework, because Next, React and the eslint
      # config move together and splitting them produces PRs that cannot pass
      # on their own.
      next-and-react:
        patterns:
          - next
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'eslint-config-next'
        update-types:
          - minor
          - patch
      # COUPLED PAIRS GET THEIR OWN GROUPS.
      #
      # This is not tidiness, it is the fix for a defect that has now occurred
      # three times: Dependabot moves ONE HALF of a pair of packages that must
      # move together, and the result is a pull request that cannot install.
      # `@vitest/coverage-v8` pins `vitest` as an EXACT peer, so a lone `vitest`
      # bump fails `npm ci` outright — that was PR #99, 13 red checks from one
      # install failure. Putting both patterns in one group forces Dependabot to
      # propose them as a single pull request for every minor and patch.
      #
      # Their MAJORS are ignored below, so this group governs the compatible
      # range where the pair genuinely can move.
      vitest-coupled:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - minor
          - patch
      # The ESLint stack moves together for the same reason. ESLint 10 was
      # refused (issue #132) because three plugins reached through
      # `eslint-config-next` still declare `eslint: ^9`; a lone plugin bump can
      # break lint just as a lone `eslint` bump can. One pull request for the
      # whole stack keeps the peer graph consistent and diagnosable.
      eslint-stack:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
        exclude-patterns:
          - 'eslint-config-next' # belongs to next-and-react, above
        update-types:
          - minor
          - patch
      # Everything else in development tooling, in one weekly pull request.
      # Widened from a hand-written package list to "all development
      # dependencies", because that list silently missed `sass` and `supabase`
      # and they arrived as two separate pull requests in the pre-P1-23 batch.
      # The coupled groups above are excluded so they keep their own PR.
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'typescript'
          - '@types/react*'
        update-types:
          - minor
          - patch
      # Production dependencies, compatible ranges only. Widened from
      # patch-only to patch AND minor: patch-only meant every production minor
      # arrived as its own pull request, which is what happened to `pino`
      # before it turned out to be a major. The framework packages keep their
      # own group above and are excluded here.
      production-updates:
        dependency-type: production
        patterns:
          - '*'
        exclude-patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@supabase/*'
        update-types:
          - minor
          - patch
    ignore:
      # A major of the framework is a migration, not a dependency bump. It is
      # raised deliberately, with its own plan.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      # Pinned to the Supabase local stack's major and the Dockerfile runtime.
      - dependency-name: '@supabase/supabase-js'
        update-types: ['version-update:semver-major']
      # -----------------------------------------------------------------------
      # Deferred majors. Each of these was proposed, reviewed against the real
      # protected tree, reproduced as failing, and closed in favour of a
      # tracking issue. Reproposing them weekly does not change the upstream
      # facts; it only trains people to ignore Dependabot.
      #
      # Scope is deliberately narrow: `version-update:semver-major` suppresses
      # MAJOR version updates only, so patches and minors still arrive. Remove
      # the relevant entry when its issue's revisit condition is met.
      #
      # ON SECURITY UPDATES — READ THIS BEFORE COPYING THE PATTERN. An earlier
      # draft of this comment claimed that "Dependabot security updates are not
      # affected by a `version-update:semver-*` ignore". That is FALSE as a
      # general rule and the claim was removed. In GitHub's options reference
      # `ignore` carries the "Security updates" marker, and "All options marked
      # with a [shield-check] icon also change how Dependabot creates pull
      # requests for security updates, EXCEPT WHERE `target-branch` IS USED."
      # The exemption sentence that does exist — "`update-types` only affects
      # version updates, not security updates" — sits under
      # `update-types` (`allow`), not under `update-types` (`ignore`).
      #
      # These ignores therefore do not touch security updates HERE only because
      # `target-branch: develop` is set above, which takes this whole
      # `package-ecosystem` block out of scope for security updates. If
      # `target-branch` is ever removed, every semver-major ignore in this list
      # — including next, react, react-dom and @supabase/supabase-js — starts
      # suppressing security-update pull requests whose only fix is a major
      # bump. Re-read this block before dropping `target-branch`.
      #
      # TypeScript 7 — issue #117. `typescript-eslint@8.65.0`, the latest
      # published release, declares `typescript: ">=4.8.4 <6.1.0"` and there is
      # no 9.x on the registry; Next.js separately reports that "TypeScript
      # 7.0.2 does not provide the compiler API required by Next.js". TS 7.0
      # ships no programmatic API at all — upstream defers that to 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Vitest 4 — issue #118. The 4.x v8 coverage provider counts the SAME 19
      # instrumented files on a different basis (line denominator 1480 -> 439),
      # so the ratchet can no longer compare like with like and two critical
      # floors breach; it also changes the `brace-expansion` waiver's
      # dependency-node fingerprint, which needs owner re-approval.
      #
      # BOTH halves are ignored together on purpose. `@vitest/coverage-v8`
      # pins `vitest` as an EXACT peer, so ignoring only one half lets the
      # mirror-image half-pair be proposed and fail `npm ci` identically —
      # which is exactly how #99 arrived. Majors only; the compatible 3.x
      # patches and minors both packages need still come through.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      # ESLint 10 — issue #132. Blocked upstream, not here: no published
      # release of `eslint-plugin-react`, `eslint-plugin-import` or
      # `eslint-plugin-jsx-a11y` accepts eslint 10, and `eslint-plugin-react`
      # crashes on the rule-context methods ESLint 10 removed
      # ("contextOrFilename.getFilename is not a function"). Those three reach
      # this repository through `eslint-config-next`, so its permissive
      # `eslint: >=9.0.0` peer does not help.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # @types/node — issue #133. NOT an upstream block: 26 passes typecheck,
      # lint, build and tests. It is refused because the supported runtime is
      # Node 22 (`engines.node: ">=22.0.0"`, CI node-version 22, Docker
      # node:22). Types ahead of the runtime let code compile against APIs that
      # do not exist when it runs. The types major must stay at or below the
      # runtime major; raise this when the runtime is raised.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Amman
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
      - security
    commit-message:
      prefix: 'chore(docker)'
    target-branch: develop
    ignore:
      # The Node major in the base image is pinned to the runtime the
      # application targets (ADR-007). Changing it is a platform decision, and
      # the nightly compatibility matrix is where the next major is evaluated.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Amman
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - security
    commit-message:
      prefix: 'ci(deps)'
    target-branch: develop
    groups:
      # Dependabot understands SHA pins and updates both the pin and the trailing
      # version comment, which is exactly the maintenance burden that makes teams
      # abandon SHA pinning. Grouping keeps it to one reviewable pull request.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
