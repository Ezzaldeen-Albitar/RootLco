# =============================================================================
# RootLco — pull-request gate.
#
# ONE workflow that ALWAYS runs, with change detection inside it. Top-level
# `paths:` filters are deliberately absent: a required status check that never
# runs stays **Pending** forever and blocks the merge with no failure to
# diagnose (CSA-06, CSA-12). The workflow always starts; the jobs decide.
#
# `ci-gate` is the single stable check. It understands the difference between a
# job that succeeded, a job that was skipped for a recorded reason, and a job
# that was skipped for no reason at all — and only the first two are acceptable.
#
# NO SECRETS. Nothing here reads a repository secret, and there is no
# `pull_request_target` anywhere in this repository.
#
# A FORK DOES, HOWEVER, LOSE ONE CAPABILITY, and saying otherwise would be a
# comment describing a workflow that no longer exists. `authenticated-browser`
# stands a full Supabase stack, a production API and a real operator account up
# on the runner, so it runs only when the pull-request head is a branch of THIS
# repository. That is a deliberate refusal of privileged execution to untrusted
# code, not an oversight — and `ci-gate` is told about it explicitly rather than
# inferring it, so an ineligible skip is recorded as
# `NOT_ELIGIBLE_FOR_SECURITY_REASON` and never rounded up to a pass.
#
# TDP-2026-10 — TEMPORARY DEVELOPMENT-PATH POLICY (Owner approval 2026-10-05).
# A pull request whose BASE is `develop` is judged under the `development`
# profile: the gate's check run is named `ci-gate (development)`, the two web
# jobs and the specialist jobs run when the change classification requires them,
# and the clean room runs its development profile unless the change escalates.
# A pull request whose base is `main` is judged exactly as before: check run
# `ci-gate`, every job, the full clean room, STRICT records. Every relaxation
# below is keyed on `github.event.pull_request.base.ref == 'develop'` and falls
# back to the full value when anything is missing. Policy, review point and
# restoration order: docs/engineering/ci-automation/pr-gate.md.
# =============================================================================

name: PR CI

# No `workflow_dispatch`: a dispatch has no pull request, so it always failed
# at the promotion-source check and could only ever produce a red gate.
on:
  pull_request:
    branches: [develop, main]

# A newer push to the same pull request supersedes the older run, keyed on the
# pull-request NUMBER — for a pull request into develop (TDP-2026-10 planner
# decision 9) and, unchanged, for one into main. Safe because a pull-request run
# is not authoritative evidence for anything — the protected verification run
# is, and it never cancels (CSA-01). Nothing here deploys, releases or touches a
# database other than an ephemeral CI container.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  change-detection:
    name: change-detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-application-build: ${{ steps.classify.outputs.run-application-build }}
      run-database-migration-replay: ${{ steps.classify.outputs.run-database-migration-replay }}
      run-database-security: ${{ steps.classify.outputs.run-database-security }}
      run-integration-tests: ${{ steps.classify.outputs.run-integration-tests }}
      run-code-security: ${{ steps.classify.outputs.run-code-security }}
      run-container-security: ${{ steps.classify.outputs.run-container-security }}
      documentation-only: ${{ steps.classify.outputs.documentation-only }}
      profile: ${{ steps.classify.outputs.profile }}
      clean-room-profile: ${{ steps.classify.outputs.clean-room-profile }}
      run-database-block: ${{ steps.classify.outputs.run-database-block }}
      run-container-block: ${{ steps.classify.outputs.run-container-block }}
      run-web-quality: ${{ steps.classify.outputs.run-web-quality }}
      run-authenticated-browser: ${{ steps.classify.outputs.run-authenticated-browser }}
      records-mode: ${{ steps.classify.outputs.records-mode }}
      records-only: ${{ steps.classify.outputs.records-only }}
      head-sha: ${{ steps.resolve.outputs.head }}
      base-sha: ${{ steps.resolve.outputs.base }}

    steps:
      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts — so the composite action below cannot be
      # found without this. Sparse and shallow on purpose: it exists only to
      # make the action file present. The composite then performs the real
      # exact-head checkout and replaces the workspace.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project
        with:
          fetch-depth: '0'
          install: 'false'

      # ADR-006 §45 and §47 in prose only until this step existed. A branch
      # ruleset cannot express it — rulesets constrain the TARGET ref, not where
      # a pull request came from — so a feature branch could open a PR straight
      # into `main` and every check would pass, because none was looking.
      #
      # Runs in change-detection, the one job every pull request reaches, so the
      # decision is made before any expensive job starts and `ci-gate` inherits
      # it through `needs`.
      - name: Promotion source policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node scripts/ci/check-promotion-source.mjs

      - name: Resolve the commits under comparison
        id: resolve
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          head="${PR_HEAD:-${GITHUB_SHA}}"
          base="${PR_BASE:-}"
          if [ -z "${base}" ] && [ -n "${BASE_REF:-}" ]; then
            base="$(git rev-parse "origin/${BASE_REF}")"
          fi
          printf 'head=%s\n' "${head}" >> "${GITHUB_OUTPUT}"
          printf 'base=%s\n' "${base}" >> "${GITHUB_OUTPUT}"
          printf 'head: %s\nbase: %s\n' "${head}" "${base}"

      # TDP-2026-10. The HEAD's classifier is code this pull request may have
      # edited, so the BASE branch's copy classifies the same diff as well and
      # the stricter answer is kept. A base copy that is missing, fails, or
      # predates the development profile cannot be compared and resolves to the
      # FULL set. The base copy never writes a step output.
      - name: Classify the change
        id: classify
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head }}
          BASE_SHA: ${{ steps.resolve.outputs.base }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ]; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          else
            # No base means no diff. Classifying against nothing produces an
            # empty change set, which classify-changes.mjs treats as "cannot
            # prove a skip is safe" and runs everything. That is the correct
            # behaviour, so it is left to happen rather than faked.
            : > changed-files.txt
          fi
          wc -l < changed-files.txt
          base_copy="$(mktemp -d)"
          mkdir -p "${base_copy}/scripts/ci" "${base_copy}/scripts/lib"
          base_ok=true
          for file in scripts/ci/classify-changes.mjs scripts/lib/development-profile.mjs scripts/lib/repository-paths.mjs; do
            if [ -z "${BASE_SHA}" ] || ! git show "${BASE_SHA}:${file}" > "${base_copy}/${file}" 2> /dev/null; then
              echo "the base branch has no copy of ${file}; the head's answer will not be trusted alone"
              base_ok=false
            fi
          done
          rm -f base-classification.json
          if [ "${base_ok}" = true ]; then
            if ! env -u GITHUB_OUTPUT node "${base_copy}/scripts/ci/classify-changes.mjs" \
              --files changed-files.txt --event "${GITHUB_EVENT_NAME}" --base-ref "${BASE_REF}" \
              --json base-classification.json > /dev/null; then
              echo "the base copy of the classifier failed; the head's answer will not be trusted alone"
              rm -f base-classification.json
            fi
          fi
          node scripts/ci/classify-changes.mjs \
            --files changed-files.txt --event "${GITHUB_EVENT_NAME}" --base-ref "${BASE_REF}" \
            --base-classification base-classification.json \
            --json classification.json --markdown classification.md

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f classification.md ]; then cat classification.md >> "${GITHUB_STEP_SUMMARY}"; fi

      - name: Upload the classification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-change-detection
          retention-days: 14
          if-no-files-found: error
          path: |
            classification.json
            classification.md
            changed-files.txt
            base-classification.json

  # ===========================================================================
  # Always required. These four run whatever changed.
  # ===========================================================================
  static-quality:
    name: static-quality
    needs: change-detection
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: static-quality
      ref: ${{ needs.change-detection.outputs.head-sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      # The changed-file ownership gate resolves this against
      # `.github/ci-baselines/phase-ownership-profiles.json`. A branch that
      # matches no rule is refused rather than judged against another phase's
      # declaration (P1-27-DO-003).
      head-branch: ${{ github.event.pull_request.head.ref }}

  # TDP-2026-10: conditional ONLY for a pull request into develop. For a pull
  # request into main this `if:` is true and the job runs exactly as it always did.
  web-quality:
    name: Web quality
    needs: change-detection
    if: >-
      github.event.pull_request.base.ref != 'develop' ||
      needs.change-detection.outputs.run-web-quality == 'true'
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: web-quality
      ref: ${{ needs.change-detection.outputs.head-sha }}
      # REQUIRED, and its absence was silent. `web-quality` now carries a
      # touched-file coverage floor, and `coverage-gate.mjs` skips that rule
      # entirely when the changed-file list is empty. Without this input the
      # reusable workflow defaults `base-ref` to '', the changed-files step takes
      # its else branch and writes an EMPTY list, and the 60% floor governs
      # nothing while every job stays green — the floor's own baseline
      # meanwhile claiming it refuses an untested edit.
      base-ref: ${{ github.event.pull_request.base.ref }}
      # REQUIRED for the same reason `base-ref` is, and absent for the same
      # silent reason. The touched-file floor does not apply to a PROMOTION — a
      # pull request whose head is a protected branch carries only changes
      # already held to that floor by the pull request that introduced them —
      # and the changed-files step decides that from THIS input. Without it the
      # step reads an empty string, the promotion is judged as an edit, and 921
      # commits of already-reviewed work are held to a per-edit rule.
      head-branch: ${{ github.event.pull_request.head.ref }}
    permissions:
      contents: read

  unit-tests-coverage:
    name: unit-tests-coverage
    needs: change-detection
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: unit-coverage
      ref: ${{ needs.change-detection.outputs.head-sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-branch: ${{ github.event.pull_request.head.ref }}

  dependency-security:
    name: dependency-security
    needs: change-detection
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_reusable-dependency-security.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}

  secret-scan:
    name: secret-scan
    needs: change-detection
    uses: ./.github/workflows/_reusable-secret-scan.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}
      depth: standard

  # The exact-SHA clean room is UNCONDITIONAL. It is the single proof the
  # acceptance criteria rest on, and a documentation-only gate pull request is
  # required to demonstrate it. A clean room that can be skipped is not one.
  #
  # TDP-2026-10: still unconditional, but for a pull request into develop it
  # runs the profile change detection chose. Every input falls back to the FULL
  # value ('full', 'true', 'strict') unless the base is develop, so a pull
  # request into main runs exactly the clean room it always ran.
  hosted-clean-room:
    name: hosted-clean-room
    needs: change-detection
    uses: ./.github/workflows/_reusable-clean-room.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}
      expected-sha: ${{ needs.change-detection.outputs.head-sha }}
      profile: ${{ github.event.pull_request.base.ref == 'develop' && needs.change-detection.outputs.clean-room-profile || 'full' }}
      run-database-block: ${{ github.event.pull_request.base.ref == 'develop' && needs.change-detection.outputs.run-database-block || 'true' }}
      run-container-block: ${{ github.event.pull_request.base.ref == 'develop' && needs.change-detection.outputs.run-container-block || 'true' }}
      records-mode: ${{ github.event.pull_request.base.ref == 'develop' && needs.change-detection.outputs.records-mode || 'strict' }}

  # ===========================================================================
  # The AUTHENTICATED browser tier — required, and gated on TRUST rather than on
  # change detection.
  #
  # `apps/web/tests/e2e/authenticated/**` is the repository's ONLY end-to-end
  # tenant-isolation proof and its ONLY route-level accessibility proof. It ran
  # on no pull request at all, and the protected job that did run it was outside
  # `protected-gate`'s `needs`, so BOTH gates could report Go while it was red.
  # It is a real dependency of `ci-gate` below now, which is the whole point.
  #
  # THE COST IS REAL AND IS ACCEPTED, NOT OVERLOOKED: this stands a Supabase
  # stack, a production API and a production web build up on every same-repository
  # pull request, roughly forty minutes of runner time. A cheaper arrangement was
  # in place and it was the arrangement that let the check be red under a green
  # gate.
  #
  # THE `if:` IS THE SECURITY BOUNDARY. A pull request from a FORK must not
  # receive privileged browser execution, so the job runs only when the head is a
  # branch of this repository. `success()` is written explicitly because supplying
  # an `if:` removes the implicit one, and without it this job would start after
  # `change-detection` had failed.
  #
  # A skip here is NOT silently accepted. `ci-gate` is told, in the same
  # expression, whether this run was eligible at all; an ineligible skip is
  # recorded as `NOT_ELIGIBLE_FOR_SECURITY_REASON`, and a skip with no such
  # statement fails the gate closed.
  # ===========================================================================
  authenticated-browser:
    name: authenticated-browser
    needs: change-detection
    #
    # TDP-2026-10: for a pull request into develop it ALSO runs only when the
    # change classification requires it. For a pull request into main the added
    # clause is true and the condition is exactly what it was.
    if: >-
      success() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.pull_request.base.ref != 'develop' ||
      needs.change-detection.outputs.run-authenticated-browser == 'true')
    uses: ./.github/workflows/_reusable-authenticated-browser.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}
      # The exact head, never the merge ref. `require-pin` is on because a pull
      # request IS the pre-merge case: a result that cannot name its commit is
      # not evidence for the commit under review.
      expected-sha: ${{ needs.change-detection.outputs.head-sha }}
      require-pin: true

  # ===========================================================================
  # Conditional. Each skip is a recorded decision that ci-gate re-checks.
  # ===========================================================================
  application-build:
    name: application-build
    needs: change-detection
    if: needs.change-detection.outputs.run-application-build == 'true'
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: build
      ref: ${{ needs.change-detection.outputs.head-sha }}

  database-migration-replay:
    name: database-migration-replay
    needs: change-detection
    if: needs.change-detection.outputs.run-database-migration-replay == 'true'
    uses: ./.github/workflows/_reusable-database-assurance.yml
    with:
      task: migration-replay
      ref: ${{ needs.change-detection.outputs.head-sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}

  database-security:
    name: database-security
    needs: change-detection
    if: needs.change-detection.outputs.run-database-security == 'true'
    uses: ./.github/workflows/_reusable-database-assurance.yml
    with:
      task: security-matrix
      ref: ${{ needs.change-detection.outputs.head-sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      rls-level: critical

  integration-tests:
    name: integration-tests
    needs: change-detection
    if: needs.change-detection.outputs.run-integration-tests == 'true'
    uses: ./.github/workflows/_reusable-integration-tests.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      collect-coverage: true

  code-security:
    name: code-security
    needs: change-detection
    if: needs.change-detection.outputs.run-code-security == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_reusable-code-security.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}

  container-security:
    name: container-security
    needs: change-detection
    if: needs.change-detection.outputs.run-container-security == 'true'
    uses: ./.github/workflows/_reusable-container.yml
    with:
      ref: ${{ needs.change-detection.outputs.head-sha }}
      severity: 'CRITICAL,HIGH'

  # ===========================================================================
  # The single stable required check.
  # ===========================================================================
  #
  # TDP-2026-10: the check-run NAME depends on the base. Only a pull request into
  # main can emit `ci-gate`, the name main's ruleset requires; a pull request
  # into develop emits `ci-gate (development)`.
  # tests/ci/workflow-context-producers.test.ts holds main's five required names
  # to their only permitted producers.
  ci-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && 'ci-gate' || 'ci-gate (development)' }}
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `authenticated-browser` is in this list, and removing it makes
    # `tests/ci/ci-gate.test.ts` fail: the three-list reconciliation there
    # compares the YAML jobs, this `needs` list and `DECLARED_JOBS`, so a job
    # cannot run unwatched and the gate cannot declare a job that does not exist.
    needs:
      - change-detection
      - static-quality
      - web-quality
      - unit-tests-coverage
      - application-build
      - database-migration-replay
      - database-security
      - integration-tests
      - dependency-security
      - code-security
      - container-security
      - secret-scan
      - hosted-clean-room
      - authenticated-browser

    steps:
      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts — so the composite action below cannot be
      # found without this. Sparse and shallow on purpose: it exists only to
      # make the action file present. The composite then performs the real
      # exact-head checkout and replaces the workspace.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project
        with:
          ref: ${{ needs.change-detection.outputs.head-sha }}
          install: 'false'

      - name: Collect every job's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence
          pattern: evidence-*
          merge-multiple: false

      - name: Record the job results verbatim
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS_JSON}" > needs.json
          cat needs.json

      - name: Evaluate the gate
        env:
          EXPECTED_SHA: ${{ needs.change-detection.outputs.head-sha }}
          BASE_SHA: ${{ needs.change-detection.outputs.base-sha }}
          # The profile is decided from the EVENT, never from the classification
          # it is about to judge: `--event` and `--base-ref` select it, and a
          # classification made under another profile is a No-Go.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # THE SAME EXPRESSION that decides whether `authenticated-browser`
          # runs, so the gate cannot disagree with the workflow about why the job
          # is absent. It reaches the script through `env:` and never through the
          # shell body — an attacker-influenced expression pasted into a `run:`
          # is the shape WFS-006 exists to keep out of this repository.
          #
          # `false` is the ONLY value that excuses the skip, and it excuses it as
          # `NOT_ELIGIBLE_FOR_SECURITY_REASON` rather than as a pass. Anything
          # else — including a missing value — makes a skip a failure.
          TRUSTED_CONTEXT: >-
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          # The classification is read back from the artifact rather than from a
          # job output: the gate must reason about the same document the jobs
          # were given, not a re-derivation that could disagree with it.
          classification=evidence/evidence-change-detection/classification.json
          if [ ! -f "${classification}" ]; then
            echo "::error::change-detection produced no classification artifact, so no skip below can be justified."
            exit 1
          fi
          node scripts/ci/evaluate-ci-gate.mjs \
            --needs needs.json \
            --classification "${classification}" \
            --evidence evidence \
            --expected-sha "${EXPECTED_SHA}" \
            --actual-sha "$(git rev-parse HEAD)" \
            --base-sha "${BASE_SHA}" \
            --trusted-context "${TRUSTED_CONTEXT}" \
            --event "${GITHUB_EVENT_NAME}" --base-ref "${BASE_REF}" \
            --markdown ci-gate.md --json ci-gate.json

      - name: Publish the gate summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f ci-gate.md ]; then cat ci-gate.md >> "${GITHUB_STEP_SUMMARY}"; fi

      - name: Upload the gate decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-ci-gate
          retention-days: 30
          if-no-files-found: warn
          path: |
            ci-gate.json
            ci-gate.md
            needs.json
