# =============================================================================
# RootLco — reusable secret scan.
#
# ONE job, ONE fixed permission set. That is not a stylistic choice: when a job
# calls a reusable workflow, the caller's permissions become the CEILING for
# EVERY job in the called file — including jobs an `if:` will skip. GitHub
# validates this statically, before any condition is evaluated.
#
# The first version of this pipeline put secret-scan, dependency-security and
# code-security in one file, gated by `inputs.task`. It could not start:
#
#   The nested job 'code-security' is requesting 'security-events: write',
#   but is only allowed 'security-events: none'.
#
# Granting SARIF write to every caller would have "fixed" it by handing write
# scope to the job whose whole purpose is pattern-matching over untrusted-
# adjacent text. Splitting the file is the fix that keeps least privilege.
#
# NO SECRETS are consumed. This job deliberately never runs `npm ci`: fewer
# third-party bytes execute before the scan that looks for credentials.
# =============================================================================

name: Reusable — secret scan

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      depth:
        description: '`standard` on pull requests, `deep` nightly (adds git history).'
        required: false
        type: string
        default: standard
      artifact-retention-days:
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: The depth must be one this workflow implements
        env:
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          case "${DEPTH}" in
            standard | deep) printf 'depth: %s\n' "${DEPTH}" ;;
            *)
              echo "::error::unknown depth '${DEPTH}'. Expected one of: standard, deep. A typo would silently skip the history scan."
              exit 1
              ;;
          esac

      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts — so the composite action below cannot be found
      # without this. Sparse and shallow on purpose: it exists only to make the
      # action file present. The composite then performs the real exact-head
      # checkout and replaces the workspace.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the project
        id: setup
        uses: ./.github/actions/setup-project
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: '0'
          # Dependency-free by design (node: builtins only), so no `npm ci`.
          install: 'false'

      - name: Tracked environment files and key material
        run: |
          set -euo pipefail
          bad=0
          if git ls-files --error-unmatch .env .env.local .env.production >/dev/null 2>&1; then
            echo "::error::A real environment file is tracked. Remove it, ROTATE the exposed values, then purge history."
            bad=1
          fi
          keys="$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks|keystore|ppk|asc|gpg)$' || printf '')"
          if [ -n "${keys}" ]; then
            echo "::error::Tracked key material found:"
            echo "${keys}"
            bad=1
          fi
          exit "${bad}"

      - name: Repository secret scanners
        run: |
          set -euo pipefail
          # These print file:line only, never the matching text — a scanner that
          # echoes what it found turns a public Actions log into the disclosure.
          npm run security:tracked-secrets
          npm run security:browser-secrets
          npm run security:scope-exclusions
          npm run validate:no-fake-data

      - name: Workflow security policy
        run: node scripts/ci/check-workflow-security.mjs --json workflow-security.json --markdown workflow-security.md

      # AR-50, the same shape as AR-45: a scan that applied NO rules and a scan
      # that found nothing produce the identical artifact and the identical green
      # tick. The report now carries its own rule count, so assert the scan was
      # armed — and assert it enumerated targets, so an empty workflow directory
      # cannot read as a clean one either.
      - name: The workflow scan must have been armed
        run: |
          set -euo pipefail
          rules="$(node -e 'const r=require("./workflow-security.json");process.stdout.write(String(r.ruleCount ?? 0))')"
          files="$(node -e 'const r=require("./workflow-security.json");process.stdout.write(String((r.scanned||[]).length))')"
          printf 'workflow-security applied %s rules across %s files\n' "${rules}" "${files}"
          if [ "${rules}" -lt 14 ]; then
            echo "::error::workflow-security reported ${rules} rules; 14 are required. A shrunken rule set reports clean for the wrong reason."
            exit 1
          fi
          if [ "${files}" -lt 10 ]; then
            echo "::error::workflow-security enumerated only ${files} file(s). Nothing scanned must never read as nothing wrong."
            exit 1
          fi

      # A workflow can be valid YAML, pass actionlint, pass every rule above,
      # and still hold a `run:` block that is not valid shell. Nothing local
      # executed one, so the first thing that noticed was a hosted runner
      # reporting exit 126 — a status naming nothing (AR-48). `bash -n` parses
      # without executing and catches the general case.
      - name: Every run block is valid shell
        run: node scripts/ci/check-run-block-syntax.mjs

      - name: Generated documents carry no credential
        run: |
          set -euo pipefail
          # This job deliberately does not build, so there is no `.next` here —
          # the BUILD job scans its own output and the container job covers image
          # layers. What this covers is the generated and public documents, which
          # are large enough to be meaningful and are what this job can see.
          node scripts/ci/scan-history.mjs --mode worktree \
            --roots docs,public,supabase --min-files 50 \
            --json worktree-scan.json --markdown worktree-scan.md

      - name: Git history (deep mode only)
        if: inputs.depth == 'deep'
        run: |
          set -euo pipefail
          # Every commit reachable from any ref, scanned for credential SHAPES.
          # Deliberately nightly: it is O(history) and would dominate a PR.
          # Output is file plus pattern class only — never a matched value.
          node scripts/ci/scan-history.mjs --mode history \
            --json history-scan.json --markdown history-scan.md

      - name: Job summary
        if: always()
        env:
          RESOLVED_SHA: ${{ steps.setup.outputs.sha }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          for file in workflow-security.md worktree-scan.md history-scan.md; do
            if [ -f "${file}" ]; then
              cat "${file}" >> "${GITHUB_STEP_SUMMARY}"
              printf '\n\n' >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          printf '_Secret scan at `%s` (depth: `%s`)_\n' "${RESOLVED_SHA}" "${DEPTH}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-secret-scan
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore
          # Findings are file + pattern class only. No matched value is written
          # to any artifact, by construction in scan-history.mjs.
          path: |
            workflow-security.json
            worktree-scan.json
            history-scan.json
            *.md
