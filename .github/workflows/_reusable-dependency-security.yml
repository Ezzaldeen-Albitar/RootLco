# =============================================================================
# RootLco — reusable dependency and supply-chain security.
#
# ONE job, ONE fixed permission set — `contents: read` plus `pull-requests: read`
# for the dependency-review action, and nothing else. See the header of
# `_reusable-secret-scan.yml` for why these three security jobs live in three
# files rather than one: a caller's permissions are the ceiling for EVERY job in
# the file it calls, including jobs an `if:` would skip.
#
# The policy is asymmetric on purpose. Production advisories are never waived.
# Development advisories may be waived only by an exact, evidenced, expiring
# exception whose CLAIM is cross-checked against a mechanically derived
# dependency-path proof.
# =============================================================================

name: Reusable — dependency security

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      artifact-retention-days:
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # `dependency-review-action` reads the pull request's dependency graph.
      pull-requests: read

    steps:
      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the project
        id: setup
        uses: ./.github/actions/setup-project
        with:
          ref: ${{ inputs.ref }}

      - name: Audit the production and full dependency trees
        run: |
          set -euo pipefail
          # `npm audit` exits non-zero whenever it finds anything, and the POLICY
          # — not the exit code — decides what blocks. The reports are captured
          # with an explicit fallback, then PARSED, so a finding can never be
          # confused with a tooling failure and an empty file can never pass.
          # dependency-policy.mjs additionally rejects an npm ERROR object, which
          # would otherwise parse cleanly and report zero advisories.
          npm audit --omit=dev --json > audit-production.json || printf ''
          npm audit --json > audit-full.json || printf ''
          for file in audit-production.json audit-full.json; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))' "${file}" \
              || { echo "::error::npm audit produced unparseable output in ${file}."; exit 1; }
          done

      - name: Licence inventory
        run: node scripts/ci/licence-inventory.mjs --json licences.json

      - name: Production dependency tree
        run: |
          set -euo pipefail
          # The production tree as npm ACTUALLY resolves it, not as package.json
          # classifies it. `npm ls` exits non-zero on an extraneous or missing
          # package, which is information rather than a failure here — the tree
          # is still written, and the parse below is what must succeed.
          npm ls --omit=dev --all --json > production-tree.json || printf ''
          node -e 'JSON.parse(require("node:fs").readFileSync("production-tree.json","utf8"))' \
            || { echo "::error::npm ls produced unparseable output; the production tree cannot be proven."; exit 1; }
          printf 'production top-level: %s\n' \
            "$(node -e 'const t=require("./production-tree.json");process.stdout.write(Object.keys(t.dependencies??{}).join(", "))')"

      - name: Dependency-path and reachability proof
        run: |
          set -euo pipefail
          # Derives, mechanically, the full path from the root package to every
          # waived package, and whether any instance is production-reachable.
          # The gate cross-checks each exception's CLAIM against this, so a
          # waiver cannot go on asserting "development only" after the package
          # moves. The container job supplies the image half of the proof.
          node scripts/ci/dependency-path-proof.mjs \
            --package brace-expansion \
            --production-tree production-tree.json \
            --json reachability-brace-expansion.json \
            --markdown reachability-brace-expansion.md

      - name: Dependency policy
        run: |
          set -euo pipefail
          node scripts/ci/dependency-policy.mjs \
            --prod-audit audit-production.json --dev-audit audit-full.json \
            --exceptions .github/ci-baselines/dependency-exceptions.json \
            --licences licences.json \
            --reachability-proof reachability-brace-expansion.json \
            --json dependency-policy.json --markdown dependency-policy.md

      - name: Outdated inventory (reported, never blocking)
        if: '!cancelled()'
        run: |
          set -euo pipefail
          # `npm outdated` exits 1 whenever anything is behind, which is almost
          # always true. It is evidence for the nightly dependency conversation,
          # not a merge gate, so its status is captured rather than propagated.
          npm outdated --json > outdated.json || printf ''
          node -e '
            const fs = require("node:fs");
            let data = {};
            try { data = JSON.parse(fs.readFileSync("outdated.json", "utf8") || "{}"); } catch { data = {}; }
            const rows = Object.entries(data);
            console.log(`packages behind latest: ${rows.length}`);
            const md = ["### Outdated dependencies", "", `**${rows.length}** package(s) behind latest. Reported only — never blocking.`, ""];
            if (rows.length) {
              md.push("| Package | Current | Wanted | Latest |", "| --- | --- | --- | --- |");
              for (const [name, v] of rows.slice(0, 40)) md.push(`| \`${name}\` | ${v.current ?? "—"} | ${v.wanted ?? "—"} | ${v.latest ?? "—"} |`);
            }
            fs.writeFileSync("outdated.md", md.join("\n") + "\n");
          '

      # The dependency-review action needs the repository's Dependency graph to
      # be switched on. It is not (P1-21-A-01), and the action's failure mode is
      # a hard error that says so:
      #
      #   Dependency review is not supported on this repository. Please ensure
      #   that Dependency graph is enabled.
      #
      # That is a repository SETTING, not a finding about this change, and it is
      # not something a pull request can fix. Rather than let a governance gap
      # masquerade as a dependency failure, the availability is probed first and
      # reported for what it is.
      #
      # Tolerating a 403/404 requires the other causes to be RULED OUT, not a
      # phrase to be recognised: a rate limit and a token-scope error are named
      # in the body and fail, and a bad ref is excluded by resolving both SHAs.
      # Anything else fails. The outcome is never silent — it goes to a warning,
      # the job summary and the uploaded evidence.
      - name: Is the GitHub dependency graph available?
        id: depgraph
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o depgraph-probe.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"
          message="$(node -e 'try{const d=require("./depgraph-probe.json");process.stdout.write(Array.isArray(d)?"":(d.message??""))}catch{process.stdout.write("")}')"
          echo "probe status: ${code}"
          # A status code is NOT a diagnosis. GitHub answers 403 for a disabled
          # Dependency graph, for a rate limit, and for a token whose scope is
          # wrong — and 404 for a disabled feature AND for a bad SHA. Keying the
          # tolerated branch on the CODE alone means a rate limit or a
          # misconfigured token reads as "the feature is off" and silently
          # disables the check. Observed for real: an unauthenticated probe from
          # a workstation returned
          #   403 {"message":"API rate limit exceeded for …"}
          # which the code-only version would have accepted as a governance gap.
          #
          # So the tolerated case must be ESTABLISHED, not inferred. Matching the
          # body against "dependency graph"-ish prose was the first attempt and
          # it was wrong in the other direction: the API answers a plain
          # `404 {"message":"Not Found"}`, which names nothing, so the step
          # failed where it should have tolerated. It failed CLOSED, which is the
          # right way round to be wrong, but it was still wrong.
          #
          # What actually distinguishes the cases is not wording — it is whether
          # the OTHER possible causes are ruled out:
          #   rate limit / abuse    -> named explicitly in the body
          #   token scope / SSO     -> named explicitly in the body
          #   a ref that does not exist -> the refs are checked directly
          # With all three excluded, a 403/404 on this endpoint means the feature.
          case "${code}" in
            200)
              echo 'available=true' >> "${GITHUB_OUTPUT}"
              printf '## Dependency review\n\nDependency graph enabled; the review ran.\n' > depgraph.md
              ;;
            403 | 404)
              # The exclusions below run on the EXTRACTED `message`, which is the
              # empty string for any body that is not JSON with a string
              # `message`. That made the default fail-OPEN: an unreadable body
              # matched no exclusion, fell through, and was recorded as "the
              # Dependency graph is not enabled" — a claim about a repository
              # SETTING derived from a body that could not be parsed. Worse, a
              # body of `<html>403 Forbidden. Rate limit exceeded.</html>` was
              # tolerated, because the words were never looked at.
              #
              # So: the body must be READABLE before anything is concluded from
              # it, and the exclusions are additionally matched against the RAW
              # bytes so a re-encoded rate limit cannot slip past.
              if [ ! -s depgraph-probe.json ] || [ -z "${message}" ]; then
                echo "::error::HTTP ${code} probing the dependency graph, and the response body is empty or not JSON with a string message. Nothing can be established from it, so it is not recorded as a repository setting. Body follows:"
                head -c 400 depgraph-probe.json || printf '(empty)'
                exit 1
              fi
              if grep -qiE 'rate limit|abuse detection|secondary rate' depgraph-probe.json; then
                echo "::error::HTTP ${code} probing the dependency graph; the raw body mentions a rate limit. That is not a repository setting."
                exit 1
              fi
              if printf '%s' "${message}" | grep -qiE 'rate limit|abuse detection|secondary rate'; then
                echo "::error::HTTP ${code} probing the dependency graph: ${message}. That is a RATE LIMIT, not a repository setting, and it must not be recorded as a governance gap."
                exit 1
              fi
              # `forbidden` deliberately NOT in this pattern. The observed reply
              # when the Dependency graph is off is exactly
              #   403 {"message":"Forbidden"}
              # so matching the generic word caught the one case this branch
              # exists to let through. GitHub names a real token-scope failure
              # specifically — "Resource not accessible by integration" — and
              # that is what is matched here.
              if printf '%s' "${message}" | grep -qiE 'not accessible by integration|saml|sso enforcement|must be granted|single sign-on'; then
                echo "::error::HTTP ${code} probing the dependency graph: ${message}. That is a TOKEN SCOPE or SSO problem, not a repository setting."
                exit 1
              fi
              # Rule out a bad ref, the other thing a 404 means on this endpoint.
              #
              # This is safe for a FORK pull request, where the head commit lives
              # in the contributor's repository. Verified rather than assumed:
              # `GET /repos/nodejs/node/commits/<head sha of a fork PR>` returns
              # 200, because GitHub makes pull-request head commits resolvable
              # through the base repository. So this probe does not false-block
              # external contributions.
              base_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${BASE_SHA}")"
              head_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}")"
              echo "ref probe: base=${base_code} head=${head_code}"
              if [ "${base_code}" != '200' ] || [ "${head_code}" != '200' ]; then
                echo "::error::HTTP ${code} from the dependency graph, and the refs do not both resolve (base ${base_code}, head ${head_code}). That is a BAD REF, not a disabled feature."
                exit 1
              fi
              printf 'ref-probe base=%s head=%s\n' "${base_code}" "${head_code}" >> depgraph-probe-refs.txt
              echo 'available=false' >> "${GITHUB_OUTPUT}"
              echo "::warning::GitHub dependency review did NOT run: the Dependency graph is not enabled on this repository (HTTP ${code}: ${message}). Tracked as P1-21-A-01. The licence deny-list and advisory thresholds are still enforced offline by dependency-policy.mjs in this same job."
              {
                printf '## Dependency review\n\n'
                printf '**NOT RUN** — the repository Dependency graph is disabled (HTTP %s).\n\n' "${code}"
                printf 'Tracked as P1-21-A-01. This is a repository setting, not a property of this change.\n'
                printf 'The same licence deny-list and advisory thresholds are enforced offline by\n'
                printf '`dependency-policy.mjs`, which DID run in this job, so the control is not lost —\n'
                printf 'what is lost is the base-to-head diff of newly introduced dependencies.\n'
              } > depgraph.md
              ;;
            *)
              echo "::error::Unexpected HTTP ${code} probing the dependency graph: ${message}. Refusing to guess whether the review is applicable."
              exit 1
              ;;
          esac

      - name: GitHub dependency review
        # Only meaningful on a pull request: it diffs the base and head manifests.
        if: github.event_name == 'pull_request' && steps.depgraph.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          # AGPL and SSPL are incompatible with a proprietary product. The same
          # list is enforced offline by dependency-policy.mjs, so an outage of
          # this action cannot silently drop the control.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

      - name: Job summary
        if: always()
        env:
          RESOLVED_SHA: ${{ steps.setup.outputs.sha }}
        run: |
          set -euo pipefail
          for file in dependency-policy.md reachability-brace-expansion.md outdated.md depgraph.md; do
            if [ -f "${file}" ]; then
              cat "${file}" >> "${GITHUB_STEP_SUMMARY}"
              printf '\n\n' >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          printf '_Dependency security at `%s`_\n' "${RESOLVED_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-dependency-security
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore
          # These describe package NAMES and VERSIONS only. No source, no
          # environment and no credential leaves the runner.
          path: |
            audit-production.json
            audit-full.json
            outdated.json
            licences.json
            production-tree.json
            reachability-brace-expansion.json
            depgraph-probe.json
            depgraph-probe-refs.txt
            dependency-policy.json
            *.md
