# =============================================================================
# RootLco — Continuous Integration. P1-01-DO-002 / P1-01-QA-009.
#
# Runs on pull requests into develop and main, and on pushes to those branches.
#
# NO DEPLOYMENT. Phase 1-1 delivers no CD workflow and none is required: no
# deployment platform is approved and no environment beyond Local exists (ADR-012).
#
# NO PRODUCTION SECRETS. Every value used here is a safe, non-secret literal.
# CI must never require a real Supabase key to pass.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Safe placeholders so env validation and the production build succeed without
  # any real credential. These are NOT secrets and must never be replaced with one.
  NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
  NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key-not-a-secret'
  NEXT_PUBLIC_APP_ENV: 'local'

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a major version per the repository security policy.
      # Commit-SHA pinning is stronger and is recorded as an open hardening item
      # in docs/phase-1/phase-1-1/security-readiness.md.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the container runtime pinned in the Dockerfile (Node 22 LTS),
          # not the developer host. See ADR-007.
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lock file is out of sync. Never `npm install` in CI.
      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Style lint (SCSS)
        run: npm run style:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      # Build the dev stage (what Phase 1-1 actually runs) and the production
      # runner stage (proves the multi-stage path is not broken). No image is
      # pushed anywhere: Phase 1-1 has no registry and no deployment target.
      - name: Build dev stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: rootlco/web:ci-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production runner stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: rootlco/web:ci-runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A non-root runtime is a stated control (ADR-007). Assert it rather than
      # trusting the Dockerfile to stay correct.
      - name: Assert the production image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint sh rootlco/web:ci-runner -c 'id -u')"
          echo "runtime uid=${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::Production image runs as root. ADR-007 requires a non-root runtime."
            exit 1
          fi

  secrets:
    name: Secret and sensitive-file scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Blocks the mistake that matters most: a real .env reaching the repository.
      - name: Fail if a committed environment file is tracked
        run: |
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "::error::A real environment file is tracked. Remove it, ROTATE the exposed values, then purge history."
            exit 1
          fi
          echo "OK: no tracked .env / .env.local / .env.production"

      - name: Fail on tracked key material
        run: |
          hits="$(git ls-files | grep -Ei '\.(pem|key|p12|pfx)$' || true)"
          if [ -n "${hits}" ]; then
            echo "::error::Tracked key material found:"; echo "${hits}"; exit 1
          fi
          echo "OK: no tracked key material"

      # Pattern scan over tracked text. Deliberately narrow: it targets real
      # credential shapes rather than the word "key", so it stays useful instead
      # of being disabled after a week of false positives.
      - name: Scan tracked files for credential patterns
        run: |
          set +e
          # service_role JWTs, Supabase publishable/secret keys, AWS keys,
          # GitHub tokens, private key headers, and hard-coded postgres passwords.
          PATTERN='(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})|(sb_secret_[A-Za-z0-9]{16,})|(AKIA[0-9A-Z]{16})|(gh[pousr]_[A-Za-z0-9]{30,})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|(postgres(ql)?://[^:@/\s]+:[^@/\s]+@)'
          matches="$(git ls-files -z \
            | xargs -0 grep -InE --binary-files=without-match "${PATTERN}" 2>/dev/null \
            | grep -vE '^\.env\.example:' \
            | grep -vE '^\.github/workflows/ci\.yml:' \
            | grep -vE '^docs/')"
          if [ -n "${matches}" ]; then
            echo "::error::Possible credential committed. Do NOT paste the value anywhere. ROTATE it first, then purge history."
            # Print only file:line, never the matching text.
            echo "${matches}" | cut -d: -f1,2
            exit 1
          fi
          echo "OK: no credential patterns in tracked files"

      # Guards the single most dangerous naming mistake in this stack.
      - name: Assert no service-role key is exposed to the browser
        run: |
          if git ls-files -z | xargs -0 grep -In 'NEXT_PUBLIC_SUPABASE_SERVICE_ROLE' 2>/dev/null; then
            echo "::error::A service-role key must never carry the NEXT_PUBLIC_ prefix. It bypasses Row-Level Security and NEXT_PUBLIC_ values are inlined into the browser bundle."
            exit 1
          fi
          echo "OK: no NEXT_PUBLIC_ service-role key"
