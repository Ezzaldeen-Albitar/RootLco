# =============================================================================
# RootLco — Continuous Integration. P1-01-DO-002 / P1-01-QA-009.
#
# Runs on pull requests into develop and main, and on pushes to those branches.
#
# NO DEPLOYMENT. Phase 1-1 delivers no CD workflow and none is required: no
# deployment platform is approved and no environment beyond Local exists (ADR-012).
#
# NO PRODUCTION SECRETS. Every value used here is a safe, non-secret literal.
# CI must never require a real Supabase key to pass.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Safe placeholders so env validation and the production build succeed without
  # any real credential. These are NOT secrets and must never be replaced with one.
  NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
  NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key-not-a-secret'
  NEXT_PUBLIC_APP_ENV: 'local'

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a major version per the repository security policy.
      # Commit-SHA pinning is stronger and is recorded as an open hardening item
      # in docs/phase-1/phase-1-1/security-readiness.md.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the container runtime pinned in the Dockerfile (Node 22 LTS),
          # not the developer host. See ADR-007.
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lock file is out of sync. Never `npm install` in CI.
      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      # P1-13-BE-001 / P1-13-DO-001: the modular-monolith boundary and the
      # handler → application service → domain service → repository layering are
      # enforced, not advised. A cross-module internal import, a handler reaching
      # the data layer, or a domain file importing the database blocks the merge.
      - name: Module boundary and layering check
        run: npm run validate:module-boundaries

      # P1-13-SEC-001: an unguarded operation cannot ship. Reconciles the route
      # tree against the operation registry: a route with no declaration, a
      # declaration with no permissions, or an audited class with no audit action
      # all fail here.
      - name: Authorization coverage check
        run: npm run validate:authorization-coverage

      # P1-14 remediation: every registered operation must carry a coverage
      # decision, and every non-pending claim must be backed by a referencing
      # test. A registered operation with no decision, or an evidence claim whose
      # test no longer references it, fails here. "pending" operations are tracked,
      # visible residuals in docs/phase-1/phase-1-14/evidence/operation-test-matrix.json.
      - name: Operation-to-test coverage check
        run: npm run validate:operation-coverage

      # P1-19: the phase's endpoint inventory and task traceability are GENERATED
      # from the operation registry, so a hand-edit or a drifted declaration fails
      # here rather than being discovered in review. It also reconciles every
      # declared permission against the seeded catalog, every audit action against
      # the controlled action catalog including its class, and the event catalog
      # against the modules that actually publish — in both directions. Runs after
      # the coverage check because it joins that check's own matrix.
      - name: P1-19 endpoint inventory and catalog reconciliation
        run: npm run validate:p1-19-inventory

      # P1-13-BE-020: the published contract must be structurally sound. The
      # code/spec DIVERGENCE gate is the unit suite below, which regenerates the
      # document from the operation registry and compares.
      # P1-20: the same treatment for the commercial surface. It additionally
      # reconciles the event PRODUCER against the catalog owner, refuses an event
      # this phase publishes while the catalog still says implementedIn: null, and
      # fails when any of the 27 task identifiers resolves to no evidence anchor.
      # It excludes its OWN generated documents from that search, because counting
      # them made the check vacuous.
      - name: P1-20 endpoint inventory and task traceability
        run: npm run validate:p1-20-inventory

      # Phase 1-21 (P1-21-DOC-001): the same reconciliation for inventory. Registered
      # here so a missing task identifier or an unreconciled catalog entry fails the
      # build rather than being noticed at gate time.
      - name: P1-21 endpoint inventory and task traceability
        run: npm run validate:p1-21-inventory

      # Phase 1-22 (P1-22-DO-001): the same reconciliation for billing, payment,
      # delivery and warranty. This is the first phase to span FOUR modules and TWO
      # id namespaces, so the script's prefix and module handling is plural
      # throughout — a check that silently assumed one of each would reconcile half
      # the phase and report the other half as clean.
      - name: P1-22 endpoint inventory and task traceability
        run: npm run validate:p1-22-inventory

      # Phase 1-22 (P1-22-SEC-002): the financial surface may not contain a
      # Number(), parseFloat, Math.*, toFixed, unary plus, or a JSON number schema.
      # A single one of those turns an exact numeric(18,4) into an approximation,
      # and the loss is silent, unrepeatable, and invisible in a passing test -
      # the wrong value is still a number and it is still close. Scoped to the
      # declared money trees rather than all of src, because a gate that banned
      # Number() everywhere would be switched off within a week.
      - name: Exact-money audit
        run: npm run validate:exact-money

      - name: OpenAPI validation
        run: npm run validate:openapi

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Style lint (SCSS)
        run: npm run style:check

      # This repository uses non-ASCII deliberately, which makes encoding damage
      # both likely and hard to see: mojibake renders as plausible punctuation in
      # a diff viewer, and a BOM is invisible until it breaks a parser.
      - name: Encoding hygiene (BOM, U+FFFD, mojibake)
        run: npm run validate:encoding

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate compose file
        run: docker compose config --quiet

      # Build the dev stage (what Phase 1-1 actually runs) and the production
      # runner stage (proves the multi-stage path is not broken). No image is
      # pushed anywhere: Phase 1-1 has no registry and no deployment target.
      - name: Build dev stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: rootlco/web:ci-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production runner stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: rootlco/web:ci-runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A non-root runtime is a stated control (ADR-007). Assert it rather than
      # trusting the Dockerfile to stay correct.
      - name: Assert the production image does not run as root
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint sh rootlco/web:ci-runner -c 'id -u')"
          echo "runtime uid=${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::Production image runs as root. ADR-007 requires a non-root runtime."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Phase 1-2 (P1-02-DO-001..003): clean-database migration validation.
  #
  # Runs the SAME migrations and the SAME database test suite the developer
  # runs locally, against a fresh PostgreSQL 17 service container (matching the
  # Supabase local stack's major version). The suite includes default-deny RLS,
  # tenant A/B isolation as a non-owner runtime role, constraint templates,
  # 50-worker allocation concurrency, and the no-business-tables scope guard.
  # (The exact test count lives in the evidence register, not in this comment.)
  #
  # The full Supabase stack is NOT started here: only the database engine is
  # required for schema validation, and the gap (Supabase-managed roles exist
  # locally but not in this container) is documented honestly in
  # docs/database/migration-standard.md. NO real credential exists below —
  # these are throwaway values for a container that lives for one CI run.
  # ---------------------------------------------------------------------------
  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret -- ephemeral CI service container, not a credential
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '54322'
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres # pragma: allowlist secret -- same throwaway container value as above
    steps:
      - name: Checkout (full history — needed for the immutability diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (locked)
        run: npm ci

      # Applied migrations are immutable (migration standard). A pull request
      # may only ADD migration files; editing or deleting one that exists on
      # the target branch fails here.
      - name: Assert applied migrations are immutable
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Fail CLOSED: if the base ref cannot be resolved, this control must
          # fail loudly rather than silently pass with an empty diff.
          git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null
          changed="$(git diff --name-status --diff-filter=MDR \
            "origin/${GITHUB_BASE_REF}...HEAD" -- supabase/migrations/)"
          if [ -n "${changed}" ]; then
            echo "::error::Migrations already on ${GITHUB_BASE_REF} were modified, renamed, or deleted. Migrations are immutable once merged — write a new forward migration instead."
            echo "${changed}"
            exit 1
          fi
          echo "OK: no existing migration was modified"

      - name: Apply all migrations to a clean database
        run: npm run db:apply-migrations

      - name: Apply declared seeds twice and validate clean business state
        run: npm run validate:seed-state

      # P1-06-SEC-001 / P1-06-DO-001: every crm column must carry a
      # classification (docs/database/crm-personal-data-classification.json), and
      # no restricted column may be marked searchable. A new unclassified CRM
      # column fails this step and blocks the merge. One canonical script, run
      # identically here and locally (npm run validate:crm-classification).
      - name: Validate CRM personal-data classification coverage
        run: npm run validate:crm-classification

      # P1-07-SEC-003 / P1-07-DO-001: every veh column must carry a classification
      # (docs/database/veh-personal-data-classification.json), no restricted column
      # may be searchable, and registry/live types must reconcile. Same canonical
      # script locally and here (npm run validate:veh-classification).
      - name: Validate Vehicle personal-data classification coverage
        run: npm run validate:veh-classification

      # P1-08-SEC-003 / P1-08-DO-001: every apt/rec column must carry a
      # classification (docs/database/apt-rec-personal-data-classification.json),
      # no restricted column may be searchable, and registry/live types must
      # reconcile. Same canonical script locally and here
      # (npm run validate:aptrec-classification).
      - name: Validate Appointment/Reception personal-data classification coverage
        run: npm run validate:aptrec-classification

      # P1-09-SEC-003 / P1-09-DO-001: every wo/tech/dia/qms column must carry a
      # classification (docs/database/wo-tech-dia-qms-personal-data-classification.json),
      # no restricted column may be searchable, no duplicate entry, and registry/live
      # types must reconcile. Same canonical script locally and here
      # (npm run validate:wo-tech-dia-qms-classification).
      - name: Validate Work-Order/Diagnostics/Technician/Quality personal-data classification coverage
        run: npm run validate:wo-tech-dia-qms-classification

      # P1-10-SEC: every svc/quo/inv column must carry a classification
      # (docs/database/svc-quo-inv-personal-data-classification.json); no restricted
      # financial column may be searchable, no duplicate entry, and registry/live
      # types must reconcile. Same canonical script locally and here.
      - name: Validate Service/Pricing/Quotation/Inventory financial-data classification coverage
        run: npm run validate:svc-quo-inv-classification

      # P1-11-SEC: every sal/wty/rpt column must carry a classification
      # (docs/database/sal-wty-rpt-personal-data-classification.json); no restricted
      # financial column may be searchable, no duplicate entry, and registry/live
      # types must reconcile. Same canonical script locally and here.
      - name: Validate Billing/Payment/Delivery/Warranty/Reporting financial-data classification coverage
        run: npm run validate:sal-wty-rpt-classification

      - name: Run the database test suite (RLS, constraints, concurrency)
        run: npm run test:db

      # P1-13-BE-022 / P1-13-QA-002..005: the backend foundation suites. They
      # need the same live PostgreSQL as the database suite, so they run in this
      # job rather than the unit job: context resolution, scoped sessions,
      # authorization through the full stack, the transaction wrapper's
      # all-or-nothing behaviour, idempotency, and the outbox worker.
      #
      # DATABASE_URL points at the same service container. The login role here is
      # the container superuser, which is NOT isolation evidence — the suites
      # open their own least-privilege connections through the harness, exactly
      # as tests/db/helpers.ts does.
      - name: Run the backend foundation test suite
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres # pragma: allowlist secret -- ephemeral CI service container
          WORKER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres # pragma: allowlist secret -- same throwaway container
        run: npm run test:backend

  secrets:
    name: Secret and sensitive-file scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Needed only to execute the dependency-free scanner below. No `npm ci`:
      # the scanner imports node: builtins only, so `npm run` needs no node_modules.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Blocks the mistake that matters most: a real .env reaching the repository.
      - name: Fail if a committed environment file is tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "::error::A real environment file is tracked. Remove it, ROTATE the exposed values, then purge history."
            exit 1
          fi
          echo "OK: no tracked .env / .env.local / .env.production"

      - name: Fail on tracked key material
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -Ei '\.(pem|key|p12|pfx)$' || printf '')"
          if [ -n "${hits}" ]; then
            echo "::error::Tracked key material found:"; echo "${hits}"; exit 1
          fi
          echo "OK: no tracked key material"

      # Phase 1-3 scope-exclusion guard (P1-03-DO-001): the pilot tenant may be
      # named only in documentation prose, the controlled provisioning seed
      # package, and its explicit seed-validation tests; no object of the
      # ADR-010 excluded service may exist. Exact allow-lists live in the
      # script; widening one is a visible, reviewable change. A hit blocks the
      # merge. (This comment deliberately avoids both guarded literals — the
      # guard scans this file too.)
      - name: Scope-exclusion guard (pilot hard-coding, excluded scope)
        run: node scripts/check-scope-exclusions.mjs

      # Pattern scan over tracked text for real credential SHAPES (service_role
      # JWTs, Supabase secret keys, AWS keys, GitHub tokens, private-key headers,
      # postgres URLs with an inline password). Deliberately narrow so it stays
      # useful instead of being disabled after a week of false positives.
      #
      # SINGLE SOURCE OF TRUTH: the patterns and the per-line `pragma: allowlist
      # secret` false-positive policy live in scripts/check-tracked-secrets.mjs,
      # which this job and `npm run security:tracked-secrets` both run — the hosted
      # job and the local verification path use identical configuration. The
      # scanner prints only file:line, never the matching text, and is
      # dependency-free (node: builtins only), so no `npm ci` is needed.
      - name: Scan tracked files for credential patterns
        run: npm run security:tracked-secrets

      # Guards the single most dangerous naming mistake in this stack: giving the
      # RLS-bypassing service-role key a NEXT_PUBLIC_ prefix, which Next.js inlines
      # into the browser bundle.
      #
      # Implemented in Node rather than inline grep, for two reasons:
      #  1. The prohibited name is assembled at runtime, so no tracked file contains
      #     it literally. The previous inline grep searched for the literal and this
      #     workflow -- a tracked file -- contained it, so the scan matched its own
      #     source and failed every run. No file is excluded to achieve this; the
      #     whole repository stays in scope.
      #  2. One authoritative implementation, runnable identically here and locally
      #     (`npm run security:browser-secrets`) on Windows, macOS and Linux.
      #
      # The scanner is dependency-free (node: builtins only), so no `npm ci` is
      # needed here. Keep it that way.
      - name: Assert no service-role key is exposed to the browser
        run: npm run security:browser-secrets

      # No fabricated business data ships or is auto-inserted (RootLco data
      # policy). Static scan for demo/mock/sample/fake business-record
      # indicators; the clean-database business-table-emptiness invariant is
      # asserted by the database job's test suite (tests/db/no-fake-data.test.ts).
      # Dependency-free (node: builtins only) — no `npm ci` needed.
      - name: Assert no fake/demo business data is shipped
        run: npm run validate:no-fake-data
