# =============================================================================
# RootLco — Continuous Integration. P1-01-DO-002 / P1-01-QA-009.
#
# Runs on pull requests into develop and main, and on pushes to those branches.
#
# NO DEPLOYMENT. Phase 1-1 delivers no CD workflow and none is required: no
# deployment platform is approved and no environment beyond Local exists (ADR-012).
#
# NO PRODUCTION SECRETS. Every value used here is a safe, non-secret literal.
# CI must never require a real Supabase key to pass.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Safe placeholders so env validation and the production build succeed without
  # any real credential. These are NOT secrets and must never be replaced with one.
  NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
  NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key-not-a-secret'
  NEXT_PUBLIC_APP_ENV: 'local'

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a major version per the repository security policy.
      # Commit-SHA pinning is stronger and is recorded as an open hardening item
      # in docs/phase-1/phase-1-1/security-readiness.md.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the container runtime pinned in the Dockerfile (Node 22 LTS),
          # not the developer host. See ADR-007.
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lock file is out of sync. Never `npm install` in CI.
      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Style lint (SCSS)
        run: npm run style:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      # Build the dev stage (what Phase 1-1 actually runs) and the production
      # runner stage (proves the multi-stage path is not broken). No image is
      # pushed anywhere: Phase 1-1 has no registry and no deployment target.
      - name: Build dev stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: rootlco/web:ci-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production runner stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: rootlco/web:ci-runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A non-root runtime is a stated control (ADR-007). Assert it rather than
      # trusting the Dockerfile to stay correct.
      - name: Assert the production image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint sh rootlco/web:ci-runner -c 'id -u')"
          echo "runtime uid=${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::Production image runs as root. ADR-007 requires a non-root runtime."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Phase 1-2 (P1-02-DO-001..003): clean-database migration validation.
  #
  # Runs the SAME migrations and the SAME database test suite the developer
  # runs locally, against a fresh PostgreSQL 17 service container (matching the
  # Supabase local stack's major version). The suite includes default-deny RLS,
  # tenant A/B isolation as a non-owner runtime role, constraint templates,
  # 50-worker allocation concurrency, and the no-business-tables scope guard.
  # (The exact test count lives in the evidence register, not in this comment.)
  #
  # The full Supabase stack is NOT started here: only the database engine is
  # required for schema validation, and the gap (Supabase-managed roles exist
  # locally but not in this container) is documented honestly in
  # docs/database/migration-standard.md. NO real credential exists below —
  # these are throwaway values for a container that lives for one CI run.
  # ---------------------------------------------------------------------------
  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret -- ephemeral CI service container, not a credential
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '54322'
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres # pragma: allowlist secret -- same throwaway container value as above
    steps:
      - name: Checkout (full history — needed for the immutability diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (locked)
        run: npm ci

      # Applied migrations are immutable (migration standard). A pull request
      # may only ADD migration files; editing or deleting one that exists on
      # the target branch fails here.
      - name: Assert applied migrations are immutable
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Fail CLOSED: if the base ref cannot be resolved, this control must
          # fail loudly rather than silently pass with an empty diff.
          git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null
          changed="$(git diff --name-status --diff-filter=MDR \
            "origin/${GITHUB_BASE_REF}...HEAD" -- supabase/migrations/)"
          if [ -n "${changed}" ]; then
            echo "::error::Migrations already on ${GITHUB_BASE_REF} were modified, renamed, or deleted. Migrations are immutable once merged — write a new forward migration instead."
            echo "${changed}"
            exit 1
          fi
          echo "OK: no existing migration was modified"

      - name: Apply all migrations to a clean database
        run: npm run db:apply-migrations

      - name: Run the database test suite (RLS, constraints, concurrency)
        run: npm run test:db

  secrets:
    name: Secret and sensitive-file scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Needed only to execute the dependency-free scanner below. No `npm ci`:
      # the scanner imports node: builtins only, so `npm run` needs no node_modules.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Blocks the mistake that matters most: a real .env reaching the repository.
      - name: Fail if a committed environment file is tracked
        run: |
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "::error::A real environment file is tracked. Remove it, ROTATE the exposed values, then purge history."
            exit 1
          fi
          echo "OK: no tracked .env / .env.local / .env.production"

      - name: Fail on tracked key material
        run: |
          hits="$(git ls-files | grep -Ei '\.(pem|key|p12|pfx)$' || true)"
          if [ -n "${hits}" ]; then
            echo "::error::Tracked key material found:"; echo "${hits}"; exit 1
          fi
          echo "OK: no tracked key material"

      # Phase 1-3 scope-exclusion guard (P1-03-DO-001): the pilot tenant may be
      # named only in documentation prose, the controlled provisioning seed
      # package, and its explicit seed-validation tests; no object of the
      # ADR-010 excluded service may exist. Exact allow-lists live in the
      # script; widening one is a visible, reviewable change. A hit blocks the
      # merge. (This comment deliberately avoids both guarded literals — the
      # guard scans this file too.)
      - name: Scope-exclusion guard (pilot hard-coding, excluded scope)
        run: node scripts/check-scope-exclusions.mjs

      # Pattern scan over tracked text. Deliberately narrow: it targets real
      # credential shapes rather than the word "key", so it stays useful instead
      # of being disabled after a week of false positives.
      #
      # FALSE-POSITIVE POLICY (explicit and per-line, not per-directory):
      # A line may be exempted ONLY by carrying the marker `pragma: allowlist secret`
      # with a justification beside it. There is no directory-wide exclusion, so a
      # credential accidentally committed to docs/ still fails the build. Adding the
      # marker is a reviewable change to a CODEOWNERS-protected surface.
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          set -uo pipefail
          # service_role JWTs, Supabase secret keys, AWS keys, GitHub tokens,
          # private key headers, and hard-coded postgres passwords.
          #
          # NOTE: the character classes use POSIX [:space:], NOT \s. Inside an ERE
          # bracket expression `\s` is the literal characters `\` and `s` -- so the
          # previous `[^:@/\s]` excluded the letter "s", and since "postgres"
          # contains an "s" the postgres-URL detector could never match anything.
          PATTERN='(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})|(sb_secret_[A-Za-z0-9]{16,})|(AKIA[0-9A-Z]{16})|(gh[pousr]_[A-Za-z0-9]{30,})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|(postgres(ql)?://[^:@/[:space:]]+:[^@/[:space:]]+@)'
          matches="$(git ls-files -z \
            | xargs -0 grep -InE --binary-files=without-match "${PATTERN}" 2>/dev/null \
            | grep -vF 'pragma: allowlist secret' || true)"
          if [ -n "${matches}" ]; then
            echo "::error::Possible credential committed. Do NOT paste the value anywhere. ROTATE it first, then purge history. If this is a documented non-secret example, add the marker 'pragma: allowlist secret' to that line with a justification."
            # Print only file:line, never the matching text.
            printf '%s\n' "${matches}" | cut -d: -f1,2
            exit 1
          fi
          echo "OK: no credential patterns in tracked files"

      # Guards the single most dangerous naming mistake in this stack: giving the
      # RLS-bypassing service-role key a NEXT_PUBLIC_ prefix, which Next.js inlines
      # into the browser bundle.
      #
      # Implemented in Node rather than inline grep, for two reasons:
      #  1. The prohibited name is assembled at runtime, so no tracked file contains
      #     it literally. The previous inline grep searched for the literal and this
      #     workflow -- a tracked file -- contained it, so the scan matched its own
      #     source and failed every run. No file is excluded to achieve this; the
      #     whole repository stays in scope.
      #  2. One authoritative implementation, runnable identically here and locally
      #     (`npm run security:browser-secrets`) on Windows, macOS and Linux.
      #
      # The scanner is dependency-free (node: builtins only), so no `npm ci` is
      # needed here. Keep it that way.
      - name: Assert no service-role key is exposed to the browser
        run: npm run security:browser-secrets
