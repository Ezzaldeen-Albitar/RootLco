# =============================================================================
# RootLco — reusable Node quality workflow.
#
# One workflow, three complete jobs selected by `task`:
#
#   static-quality  formatting, types, lint, every repository gate, generated-file
#                   drift, workflow security, test honesty. No database, no build.
#   unit-coverage   the unit tier plus its coverage ratchet.
#   build           the API production build, its integrity, and the size ratchet.
#   web-quality     every gate the web application owns: types, lint, Sass,
#                   formatting, component tests, the design-token and brand
#                   gates, and its production build.
#
# `web-quality` is a separate task and not a few extra steps inside
# `static-quality` for the reason the whole split exists: the web application
# failing its own lint and the repository failing its formatting are different
# conversations, and `ci-gate` has to be able to tell them apart. It is also the
# job that closes P1-25-F-015 — before it, hosted CI invoked ZERO web commands,
# so every web gate was green in the only sense that nothing had ever run it.
#
# They are separate CALLS rather than one job because they are independent and
# should run in parallel, and because `ci-gate` has to reason about them
# separately — a build failure and a lint failure are different conversations.
#
# NO SECRETS. Everything below is a non-secret placeholder; CI must never require
# a real credential to pass.
# =============================================================================

name: Reusable — Node quality

on:
  workflow_call:
    inputs:
      task:
        description: One of `static-quality`, `unit-coverage`, `build`.
        required: true
        type: string
      ref:
        description: Commit to check out. Defaults to the exact head.
        required: false
        type: string
        default: ''
      base-ref:
        description: Base branch name, used for the touched-file coverage floor.
        required: false
        type: string
        default: ''
      artifact-retention-days:
        required: false
        type: number
        default: 14
    outputs:
      unit-tests:
        description: Number of unit tests executed.
        value: ${{ jobs.node-quality.outputs.unit-tests }}
      coverage-lines:
        description: Unit-tier line coverage percentage.
        value: ${{ jobs.node-quality.outputs.coverage-lines }}
      openapi-paths:
        description: Paths in the committed OpenAPI document.
        value: ${{ jobs.node-quality.outputs.openapi-paths }}
      openapi-operations:
        description: Operations in the committed OpenAPI document.
        value: ${{ jobs.node-quality.outputs.openapi-operations }}
      standalone-bytes:
        description: Size of `apps/api/.next/standalone` in bytes.
        value: ${{ jobs.node-quality.outputs.standalone-bytes }}
      web-tests:
        description: Number of web component tests executed.
        value: ${{ jobs.node-quality.outputs.web-tests }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
  NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key-not-a-secret'
  NEXT_PUBLIC_APP_ENV: 'local'

jobs:
  node-quality:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      unit-tests: ${{ steps.unit.outputs.total }}
      coverage-lines: ${{ steps.coverage.outputs.lines }}
      openapi-paths: ${{ steps.contract.outputs.paths }}
      openapi-operations: ${{ steps.contract.outputs.operations }}
      standalone-bytes: ${{ steps.size.outputs.bytes }}
      web-tests: ${{ steps.web-tests.outputs.total }}

    steps:
      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts — so the composite action below cannot be
      # found without this. Sparse and shallow on purpose: it exists only to
      # make the action file present. The composite then performs the real
      # exact-head checkout and replaces the workspace.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      # EVERY substantive step below is gated on `inputs.task`. Without this,
      # a typo in a caller ("unit_coverage") would skip all of them, upload an
      # empty artifact, and report SUCCESS — and `ci-gate` would read that
      # success and say Go over a job that ran nothing.
      - name: The task must be one this workflow implements
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "${TASK}" in
            static-quality | unit-coverage | build | web-quality) printf 'task: %s\n' "${TASK}" ;;
            *)
              echo "::error::unknown task '${TASK}'. Expected one of: static-quality, unit-coverage, build, web-quality. A job that recognises no task would skip every step and report success."
              exit 1
              ;;
          esac

      - name: Set up the project
        id: setup
        uses: ./.github/actions/setup-project
        with:
          ref: ${{ inputs.ref }}
          # Change detection and the touched-file coverage floor both need the
          # base branch, so history is required for every task except the build.
          fetch-depth: ${{ inputs.task == 'build' && '1' || '0' }}

      # =======================================================================
      # static-quality
      # =======================================================================
      - name: Formatting, types and lint
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          # No stylesheet gate here. apps/api holds no stylesheets after the
          # pre-P1-26 boundary remediation, and apps/web's stylesheets are gated
          # by the web-quality task (which also proves the Stylelint rules fire).
          # Running it in both places would lint the same files twice and imply
          # a coverage this job does not have.

      - name: YAML and JSON are parseable
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          # Every tracked JSON must parse. A malformed catalog would otherwise
          # only surface at runtime, in the module that reads it.
          bad=0
          while IFS= read -r file; do
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'))" "${file}" \
              || { echo "::error file=${file}::not valid JSON"; bad=1; }
          done < <(git ls-files '*.json' ':!:package-lock.json')
          # YAML. A check that cannot run must not report success, so the parser's
          # availability is asserted first rather than discovered as a cryptic
          # ImportError inside the loop.
          if ! python3 -c 'import yaml' 2>/dev/null; then
            echo "::error::PyYAML is unavailable on this runner, so the YAML validity check cannot run. It must not be silently skipped — install it or replace the parser."
            exit 1
          fi
          while IFS= read -r file; do
            python3 -c "import sys,yaml;yaml.safe_load(open(sys.argv[1],encoding='utf-8'))" "${file}" \
              || { echo "::error file=${file}::not valid YAML"; bad=1; }
          done < <(git ls-files '*.yml' '*.yaml')
          exit "${bad}"

      - name: GitHub Actions workflow syntax (actionlint)
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          # Pinned by version AND verified by checksum: a linter fetched over the
          # network is itself a supply-chain input.
          version=1.7.7
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output /tmp/actionlint.tgz "${url}"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum --check --status \
            || { echo "::error::actionlint checksum mismatch — refusing to execute the download."; exit 1; }
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color -shellcheck=

      - name: Workflow security policy
        if: inputs.task == 'static-quality'
        run: node scripts/ci/check-workflow-security.mjs --json workflow-security.json --markdown workflow-security.md

      - name: Shell script lint (shellcheck)
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          # shellcheck ships on the GitHub-hosted image; no download to verify.
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found — this check would report clean over an empty set."
            exit 1
          fi
          printf 'linting %d shell script(s)\n' "${#scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

      - name: Repository gates
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          npm run validate:encoding
          # `--record-only` because the two canonical Word documents live OUTSIDE
          # the repository by owner decision and must never be committed. A
          # runner cannot see them, so the default mode was a gate that could
          # only ever be made green by destroying the property it protects.
          # Record-only still fails on a malformed record, on an entry with no
          # recorded hash, and on a document that IS present but changed.
          npm run validate:canonical-docs -- --record-only
          npm run validate:no-fake-data
          npm run security:scope-exclusions
          npm run validate:module-boundaries
          npm run validate:authorization-coverage
          npm run validate:operation-coverage
          npm run validate:openapi
          npm run validate:p1-19-inventory
          npm run validate:p1-20-inventory
          npm run validate:p1-21-inventory
          npm run validate:p1-22-inventory
          npm run validate:p1-23-inventory
          npm run validate:p1-24-register
          npm run validate:exact-money
          npm run validate:run-block-syntax
          # The six classification validators are NOT here. They open a
          # PostgreSQL connection, and this job has no database — see
          # P1-25-F-023. They run in the database-bearing job in ci.yml, which
          # applies every migration first.
          npm run security:all
          # Every quality command is registered, classified, and reachable from
          # both the local aggregate and this workflow. Without it, a check can
          # exist, be correct, and never once run — which is exactly how three
          # gates rotted unnoticed before P1-25.
          npm run validate:command-coverage
          # apps/api is the Backend. These two keep Frontend material and
          # generated output out of it, and out of the repository at large.
          npm run validate:api-backend-only
          npm run validate:generated-artifacts
          # OIR-01 is open, so both tiers hold a placeholder. This fails the
          # moment one of them holds a real name and the other does not.
          npm run validate:product-name

      - name: Route ↔ OpenAPI registry parity
        if: inputs.task == 'static-quality'
        run: node scripts/ci/check-route-registry-parity.mjs --json route-parity.json --markdown route-parity.md

      - name: Test honesty
        if: inputs.task == 'static-quality'
        run: node scripts/ci/check-test-honesty.mjs --json test-honesty.json --markdown test-honesty.md

      - name: Forbidden files and merge-conflict markers
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          bad=0
          # Build output, coverage reports, editor state and OS debris must never
          # be tracked: they make every diff noisy and can carry local paths.
          # `|| printf ''` rather than `|| true`: grep exits 1 on no match, which
          # is the GOOD case here, but `|| true` would ALSO swallow a genuine
          # `git ls-files` failure and report "no forbidden files" over an empty
          # result. This substitutes an empty string without masking a crash,
          # because `set -o pipefail` still catches a failing left-hand side.
          forbidden="$(git ls-files | grep -E '^(\.next/|coverage/|node_modules/|dist/|build/)|(^|/)(\.DS_Store|Thumbs\.db|npm-debug\.log|\.idea/|\.vscode/settings\.json)$' || printf '')"
          if [ -n "${forbidden}" ]; then
            echo "::error::tracked files that must not be committed:"; echo "${forbidden}"; bad=1
          fi
          # A conflict marker that reaches a branch compiles in some languages and
          # is invisible in a rendered document.
          markers="$(git grep -In -E '^(<{7}|={7}|>{7})( |$)' -- . ':!:*.md' ':!:scripts/ci/*' || printf '')"
          if [ -n "${markers}" ]; then
            echo "::error::merge-conflict markers found:"; echo "${markers}"; bad=1
          fi
          exit "${bad}"

      - name: Lockfile and manifest consistency
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          # `npm ci` in the setup step already fails when the two disagree. This
          # asserts the two further properties it does not check.
          node -e '
            const fs = require("node:fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const problems = [];
            if (lock.lockfileVersion < 3) problems.push(`lockfileVersion ${lock.lockfileVersion} predates npm 7`);
            if (lock.name !== pkg.name) problems.push(`lockfile name ${lock.name} != package name ${pkg.name}`);
            if (lock.version !== pkg.version) problems.push(`lockfile version ${lock.version} != package version ${pkg.version}`);
            const root = lock.packages?.[""] ?? {};
            for (const field of ["dependencies", "devDependencies"]) {
              const a = JSON.stringify(pkg[field] ?? {});
              const b = JSON.stringify(root[field] ?? {});
              if (a !== b) problems.push(`${field} in package.json does not match the lockfile root entry`);
            }
            if (problems.length) { for (const p of problems) console.error(`::error::${p}`); process.exit(1); }
            console.log("OK: lockfile and manifest agree");
          '

      - name: Generated evidence must be regenerable, not hand-maintained
        if: inputs.task == 'static-quality'
        env:
          UPDATE_OPENAPI: '1'
        run: |
          set -euo pipefail
          # Regenerate everything that is generated, then require an empty diff.
          # Validating the committed artefact is weaker: a hand-edit that happens
          # to be well-formed passes a structural check.
          npx vitest run tests/openapi-contract.test.ts --reporter=dot
          npx prettier --write docs/api/openapi.v1.json --log-level warn
          node scripts/p1-19-endpoint-inventory.mjs
          node scripts/p1-20-endpoint-inventory.mjs
          node scripts/p1-21-endpoint-inventory.mjs
          if ! git diff --exit-code; then
            echo "::error::Generated evidence is stale. Run the generators locally and commit the result — do not hand-edit generated files."
            exit 1
          fi
          echo "OK: every generated document matches its generator"

      - name: OpenAPI totals
        id: contract
        if: inputs.task == 'static-quality'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const doc = JSON.parse(fs.readFileSync("docs/api/openapi.v1.json", "utf8"));
            const methods = ["get","put","post","delete","patch","head","options","trace"];
            const paths = Object.keys(doc.paths ?? {}).length;
            let operations = 0;
            for (const item of Object.values(doc.paths ?? {})) {
              for (const m of methods) if (item[m]) operations += 1;
            }
            fs.writeFileSync("openapi-totals.json", JSON.stringify({ paths, operations }, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths=${paths}\noperations=${operations}\n`);
            console.log(`OpenAPI: ${paths} paths, ${operations} operations`);
          '

      # =======================================================================
      # unit-coverage
      # =======================================================================
      - name: Unit tier with coverage
        if: inputs.task == 'unit-coverage'
        run: |
          set -euo pipefail
          # The exit status of THIS command is the verdict. The JSON report below
          # is evidence, and summarise-vitest.mjs independently re-derives the
          # verdict from it — so a green shell and a red report cannot coexist.
          npm run test -- --coverage \
            --reporter=default --reporter=json --outputFile=vitest-unit.json \
            --coverage.reportsDirectory=coverage/unit \
            --coverage.reporter=json-summary --coverage.reporter=json \
            --coverage.reporter=html --coverage.reporter=text-summary

      - name: Summarise the unit tier
        id: unit
        if: inputs.task == 'unit-coverage' && !cancelled()
        run: |
          set -euo pipefail
          node scripts/ci/summarise-vitest.mjs \
            --input vitest-unit.json --label unit \
            --json test-totals-unit.json --markdown tests-unit.md
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync("test-totals-unit.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `total=${s.total}\n`);
          '

      - name: Changed files, for the touched-file coverage floor
        if: inputs.task == 'unit-coverage' && !cancelled()
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF}" ] && git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            # Renames are EXCLUDED when the content is identical. The
            # touched-file coverage floor exists to stop new or modified code
            # shipping untested; a file that only moved introduces no new code,
            # and failing it would make any large refactor unmergeable for a
            # reason unrelated to coverage. A rename that also CHANGED content
            # scores below R100 and is still counted.
            git diff --name-status -M --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
              | awk '/^R100/ { next } { print $NF }' > changed-files.txt
          else
            : > changed-files.txt
          fi
          wc -l < changed-files.txt

      - name: Coverage ratchet
        id: coverage
        if: inputs.task == 'unit-coverage' && !cancelled()
        run: |
          set -euo pipefail
          node scripts/ci/coverage-gate.mjs \
            --summary coverage/unit/coverage-summary.json \
            --baseline .github/ci-baselines/coverage-baseline.unit.json \
            --changed changed-files.txt \
            --json coverage-gate.json --markdown coverage.md
          node -e '
            const fs = require("node:fs");
            const g = JSON.parse(fs.readFileSync("coverage-gate.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `lines=${g.totals.lines.measured}\n`);
          '

      # =======================================================================
      # build
      # =======================================================================
      - name: Environment contract for the production build
        if: inputs.task == 'build'
        run: node scripts/ci/check-env-contract.mjs --json env-contract.json --markdown env-contract.md

      - name: Production build
        if: inputs.task == 'build'
        run: |
          set -euo pipefail
          # `set -o pipefail` above is what makes `tee` safe here: without it the
          # pipeline would report tee's exit status and a failing build would
          # look green. Do not remove it, and do not add a `|| true`.
          npm run build 2>&1 | tee build.log

      - name: Build warning inventory
        if: inputs.task == 'build' && !cancelled()
        run: |
          set -euo pipefail
          # `grep -c` exits 1 when it matches nothing, which is the GOOD case, so
          # the count is computed without letting that status fail the step or be
          # discarded with a blanket `|| true`.
          count="$(grep -icE '(^|[^a-z])warn(ing)?([^a-z]|$)' build.log || printf 0)"
          printf '%s\n' "${count}" > warning-count.txt
          echo "build warnings: ${count}"
          if [ "${count}" -gt 0 ]; then
            grep -iE '(^|[^a-z])warn(ing)?([^a-z]|$)' build.log | head -50 > build-warnings.txt
          else
            : > build-warnings.txt
          fi

      - name: The build output carries no credential
        if: inputs.task == 'build'
        run: |
          set -euo pipefail
          # THE place this check belongs: a value inlined into a bundle by the
          # build reaches every browser that loads the page, and it never
          # existed as a tracked file so no tracked-file scanner could see it.
          # The secret-scan job cannot do this — it does not build.
          node scripts/ci/scan-history.mjs --mode worktree \
            --roots apps/api/.next,apps/api/public --min-files 20 \
            --json build-output-scan.json --markdown build-output-scan.md

      - name: Build output integrity and size ratchet
        id: size
        if: inputs.task == 'build'
        run: |
          set -euo pipefail
          node scripts/ci/build-size-report.mjs \
            --dir apps/api/.next \
            --baseline .github/ci-baselines/build-size-baseline.json \
            --json build-size.json --markdown build.md
          node -e '
            const fs = require("node:fs");
            const b = JSON.parse(fs.readFileSync("build-size.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `bytes=${b.sizes.standaloneBytes}\n`);
          '

      # =======================================================================
      # web-quality
      # =======================================================================
      - name: Web formatting, types and lint
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          npm run format:check:web
          npm run typecheck:web
          npm run lint:web

      - name: Web Sass policy
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          # ADR-013 direction safety lives here. The rule that enforces it was
          # declared with an invalid option shape until P1-25 and was therefore
          # SKIPPED by Stylelint while the command still exited zero, so
          # `style:check:web` alone is not sufficient evidence that it ran —
          # `tests/stylelint-policy.test.ts` in the web tier proves the rules fire.
          npm run style:check:web

      - name: Web design-token, brand and boundary gates
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          npm run validate:web-tokens
          npm run validate:web-brand
          # No fetch outside the API layer, no import of API server or Supabase
          # source, no dangerouslySetInnerHTML. Each of those failures is
          # invisible in review and compiles perfectly.
          npm run validate:web-boundary

      - name: Web component tier
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          # An explicit script, not flags forwarded through two npm layers —
          # that is where they were being dropped, leaving vitest on its default
          # reporter and the summariser with no report to read.
          npm run test:web-ci

      - name: Summarise the web tier
        id: web-tests
        if: inputs.task == 'web-quality' && !cancelled()
        run: |
          set -euo pipefail
          node scripts/ci/summarise-vitest.mjs \
            --input apps/web/vitest-web.json --label web \
            --json test-totals-web.json --markdown tests-web.md
          node -e '
            const fs = require("node:fs");
            const s = JSON.parse(fs.readFileSync("test-totals-web.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `total=${s.total}\n`);
          '

      - name: Web production build
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          # `set -o pipefail` above is what makes `tee` safe: without it the
          # pipeline reports tee's status and a failing build looks green.
          npm run build:web 2>&1 | tee web-build.log

      - name: Install the browser the smoke needs
        if: inputs.task == 'web-quality'
        run: npm run test:e2e:install --workspace @rootlco/web

      - name: Browser smoke across viewports and both directions
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          # Against a real production build. Five projects: two desktop widths,
          # a laptop width, a tablet width, and a reduced-motion context — an
          # RTL layout defect is invisible in an LTR run and vice versa.
          npm run test:web-e2e

      - name: The web build output carries no credential
        if: inputs.task == 'web-quality'
        run: |
          set -euo pipefail
          # A value inlined into a client bundle reaches every browser that loads
          # the page and never existed as a tracked file, so no tracked-file
          # scanner could ever have seen it.
          node scripts/ci/scan-history.mjs --mode worktree \
            --roots apps/web/.next --min-files 20 \
            --json web-build-scan.json --markdown web-build-scan.md

      # =======================================================================
      # evidence — uploaded even when a step above failed
      # =======================================================================
      - name: Job summary
        if: always()
        env:
          TASK: ${{ inputs.task }}
          RESOLVED_SHA: ${{ steps.setup.outputs.sha }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          for file in workflow-security.md route-parity.md test-honesty.md env-contract.md tests-unit.md coverage.md build.md; do
            if [ -f "${file}" ]; then
              cat "${file}" >> "${GITHUB_STEP_SUMMARY}"
              printf '\n\n' >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          printf '_Task `%s` at `%s` · npm cache hit: `%s`_\n' \
            "${TASK}" "${RESOLVED_SHA}" "${CACHE_HIT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ inputs.task }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore
          path: |
            workflow-security.json
            route-parity.json
            test-honesty.json
            openapi-totals.json
            vitest-unit.json
            test-totals-unit.json
            coverage-gate.json
            coverage/unit/coverage-summary.json
            coverage/unit/coverage-final.json
            build-size.json
            env-contract.json
            build.log
            build-warnings.txt
            changed-files.txt
            apps/web/vitest-web.json
            apps/web/playwright-report.json
            test-totals-web.json
            web-build-scan.json
            web-build.log
            *.md

      - name: Upload the HTML coverage report
        if: always() && inputs.task == 'unit-coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-unit
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore
          path: coverage/unit/**
