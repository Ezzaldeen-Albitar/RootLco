# =============================================================================
# RootLco — protected-branch verification.
#
# Separated from the pull-request gate because of CSA-01: `ci.yml` used ONE
# concurrency group for both `pull_request` and `push` with
# `cancel-in-progress: true`, so two merges landing close together silently
# cancelled the older protected-push run. Every phase gate record cites a
# protected push run as proof, and a cancelled run is not proof.
#
# Here `cancel-in-progress` is FALSE and the group is keyed on the branch. A
# protected run always finishes. Two runs may overlap; that is the correct
# trade, because the alternative is discarding authoritative evidence.
#
# This is the run whose result is quoted in a gate record.
# =============================================================================

name: Protected branch verification

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: protected-${{ github.workflow }}-${{ github.ref }}
  # NEVER cancel. See above.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The push event gives no base to diff against, so nothing is conditional
  # here: on a protected branch everything runs, every time.
  static-quality:
    name: static-quality
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: static-quality
      artifact-retention-days: 30

  web-quality:
    name: web-quality
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: web-quality
      artifact-retention-days: 30

  unit-tests-coverage:
    name: unit-tests-coverage
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: unit-coverage
      artifact-retention-days: 30

  application-build:
    name: application-build
    uses: ./.github/workflows/_reusable-node-quality.yml
    with:
      task: build
      artifact-retention-days: 30

  database-migration-replay:
    name: database-migration-replay
    uses: ./.github/workflows/_reusable-database-assurance.yml
    with:
      task: migration-replay
      artifact-retention-days: 30

  database-security:
    name: database-security
    uses: ./.github/workflows/_reusable-database-assurance.yml
    with:
      task: security-matrix
      rls-level: critical
      artifact-retention-days: 30

  integration-tests:
    name: integration-tests
    uses: ./.github/workflows/_reusable-integration-tests.yml
    with:
      collect-coverage: true
      artifact-retention-days: 30

  dependency-security:
    name: dependency-security
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_reusable-dependency-security.yml
    with:
      artifact-retention-days: 30

  code-security:
    name: code-security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_reusable-code-security.yml
    with:
      artifact-retention-days: 30

  secret-scan:
    name: secret-scan
    uses: ./.github/workflows/_reusable-secret-scan.yml
    with:
      depth: standard
      artifact-retention-days: 30

  container-security:
    name: container-security
    uses: ./.github/workflows/_reusable-container.yml
    with:
      severity: 'CRITICAL,HIGH'
      artifact-retention-days: 30

  hosted-clean-room:
    name: hosted-clean-room
    uses: ./.github/workflows/_reusable-clean-room.yml
    with:
      expected-sha: ${{ github.sha }}
      artifact-retention-days: 90

  # ===========================================================================
  # The AUTHENTICATED browser tier — `P1-27-DO-001`.
  #
  # `apps/web/tests/e2e/authenticated/**` holds the repository's ONLY end-to-end
  # tenant-isolation proof and its ONLY route-level accessibility proof, and for
  # the whole of P1-27 it was executed by no hosted job at all. The omission was
  # declared in `.github/ci-baselines/unrun-test-tiers.json` on the reasoning
  # that "a hosted runner is not given a live Supabase, a live API and a real
  # account". That reasoning is FALSE, and this job is the demonstration:
  #
  #   - a hosted runner has Docker, and the Supabase CLI is a devDependency of
  #     this repository (`package.json`), so `supabase start` brings up the same
  #     GoTrue the Owner signs in to;
  #   - `scripts/dev/owner-acceptance/create-owner-account.mjs` builds the real
  #     account, the second tenant and the permission grants through the
  #     platform's own tables — no shortcut, no service-role key in the browser;
  #   - its three local-only guards (`context.mjs`, `assertLocalTarget`) are an
  #     opt-in value, a loopback database and a loopback identity provider. All
  #     three are satisfiable here, and they are satisfied deliberately below
  #     rather than by accident.
  #
  # GoTrue is genuinely mandatory and no lighter substitute exists:
  # `installIamRuntime()` in `apps/api/src/modules/iam/index.ts` builds a
  # `SupabaseIdentityProvider` from configuration whenever no provider was
  # installed by a test harness, and nothing outside a test can install the fake.
  # So the API cannot be authenticated against the bare `postgres:17-alpine` the
  # clean room provisions — and it could not share that job in any case, because
  # `assertLocalTarget` pins `DB_PORT` to 54322, the very port that service
  # container already binds.
  #
  # WHY HERE, AND WHAT THIS JOB IS NOT
  #
  # It is NOT in `protected-gate`'s `needs`, and that is a limitation rather than
  # a design: `DECLARED_JOBS` in `scripts/ci/evaluate-ci-gate.mjs` is shared by
  # this workflow and `pr-ci.yml`, so a job added there must exist in BOTH, and
  # adding a job to `pr-ci.yml` requires updating the job counts recorded in
  # `docs/engineering/ci-automation/pull-request-body.md` — a document outside
  # this branch's ownership. Until that is done, `protected-gate` can be green
  # while this check is red, so the check must be read on its own. That state is
  # written down in `.github/ci-baselines/unrun-test-tiers.json` and asserted by
  # `tests/ci/e2e-tier-coverage.test.ts` so it cannot quietly become permanent.
  #
  # A GREEN RUN THAT RAN NOTHING IS THE FAILURE MODE THIS PHASE EXISTS TO CATCH,
  # so the last step derives what executed from the Playwright report and fails
  # unless every authenticated spec file contributed at least one executed test.
  # ===========================================================================
  authenticated-browser:
    name: authenticated-browser
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # The three guards in `scripts/dev/owner-acceptance/context.mjs`, met on
      # purpose. `DB_PORT` is not a choice: `assertLocalTarget` refuses anything
      # but 54322, the Supabase local database port.
      ROOTLCO_ENV: local-acceptance
      DB_HOST: 127.0.0.1
      DB_PORT: '54322'
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres # pragma: allowlist secret -- the Supabase local default, on a runner destroyed with the job
      # `local` is what keeps the session cookie unmarked `Secure`, which a
      # plain-HTTP origin would otherwise discard silently — the exact failure
      # `auth.setup.ts` warns about. It is a BUILD-time value for the web.
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

    steps:
      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts — so the composite action below cannot be
      # found without this. Sparse and shallow on purpose: it exists only to
      # make the action file present. The composite then performs the real
      # exact-head checkout and replaces the workspace.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project

      - name: Start the local Supabase stack
        run: |
          set -euo pipefail
          docker --version
          npx --no-install supabase start

      - name: Apply every migration and every seed, deterministically
        run: |
          set -euo pipefail
          # `supabase start` seeds a fresh volume, but "fresh" is an assumption
          # about the runner rather than a statement about this step. A reset
          # makes the database state a consequence of the committed migrations
          # and seeds and of nothing else — and `create-owner` refuses to run
          # against an empty `iam.permissions`, which is what seed 04 fills.
          npm run supabase:reset

      - name: Publish the identity-provider settings the API needs
        run: |
          set -euo pipefail
          # Read from the CLI, never from a committed default: the CLI is the
          # only thing that knows what the running stack actually issued. The two
          # secrets are masked BEFORE they are written anywhere.
          npx --no-install supabase status -o json > "${RUNNER_TEMP}/supabase-status.json"
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/supabase-status.json", "utf8");
            const status = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
            const missing = ["API_URL", "ANON_KEY", "SERVICE_ROLE_KEY", "JWT_SECRET"].filter((name) => !status[name]);
            if (missing.length > 0) {
              console.log("::error::supabase status did not report: " + missing.join(", "));
              process.exit(1);
            }
            for (const secret of [status.SERVICE_ROLE_KEY, status.JWT_SECRET]) console.log("::add-mask::" + secret);
            const api = String(status.API_URL).replace(/\/$/, "");
            fs.appendFileSync(process.env.GITHUB_ENV, [
              "NEXT_PUBLIC_SUPABASE_URL=" + api,
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=" + status.ANON_KEY,
              "SUPABASE_SERVICE_ROLE_KEY=" + status.SERVICE_ROLE_KEY,
              "AUTH_JWT_SECRET=" + status.JWT_SECRET,
              "AUTH_JWT_ISSUER=" + api + "/auth/v1",
              ""
            ].join("\n"));
            console.log("identity provider: " + api);
          '

      - name: The identity provider answers before anything depends on it
        run: |
          set -euo pipefail
          # Proving the precondition separately is the point. Without it, a stack
          # that came up half-formed would surface as twenty failing browser
          # tests rather than as one named missing service.
          curl -fsS "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/health"
          printf '\n'

      - name: Install the browser the tier needs
        # Its own step: a download is not a verification, and folding it into
        # the run would make a network failure look like a test failure.
        run: npm run test:e2e:install --workspace @rootlco/web

      - name: Bootstrap the operator, the workspace and the isolation counterpart
        run: |
          set -euo pipefail
          # Creates Tenant A, Tenant B — which the Owner holds no membership in —
          # the roles, the grants and the permission catalogue mapping, plus the
          # database login the API runs as: a member of `app_runtime` with
          # neither SUPERUSER nor BYPASSRLS. That last property is what makes the
          # isolation result mean anything; an API connected as `postgres` would
          # bypass every row-level policy and pass this suite regardless.
          npm run acceptance:create-owner

      - name: Build the API and the web application
        run: |
          set -euo pipefail
          npm run build:api
          npm run build:web

      - name: Start the API and wait for it to report itself ready
        run: |
          set -euo pipefail
          # `next start` against the production build, not `next dev`: a dev
          # server compiles each route on first request, and a cold compile on a
          # shared runner does not fit the 30-second per-test budget.
          #
          # `--hostname localhost`, because that is the origin the suite and the
          # API base URL both name, and a hostname binds ONE address family.
          nohup npm run start --workspace @rootlco/api -- --hostname localhost --port 3000 > api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health/ready > api-ready.json; then
              printf 'API ready after %s attempt(s)\n' "${attempt}"
              cat api-ready.json
              printf '\n'
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API never reported ready. Its output follows."
          cat api.log
          exit 1

      - name: The authenticated browser tier
        env:
          # The variable whose absence was the finding. Nothing else in the
          # repository sets it; `apps/web/playwright.config.ts` gates the three
          # authenticated projects on it, and the five anonymous projects carry
          # `testIgnore` for the same directory.
          ROOTLCO_E2E_AUTH: '1'
        run: |
          set -euo pipefail
          # Credentials are NOT passed through the environment. `auth.setup.ts`
          # and `isolation.spec.ts` both read the git-ignored handoff file the
          # bootstrap wrote, so the password never becomes a workflow value.
          npm run test:web-e2e-authenticated

      - name: A run that collected nothing is a failure, not a pass
        if: always()
        run: |
          set -euo pipefail
          # Derived from the report and from the spec directory — never from a
          # written-down number, which is the shape that lets a floor and a
          # measurement be lowered together.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const report = path.join("apps", "web", "playwright-report.json");
            if (!fs.existsSync(report)) {
              console.log("::error::" + report + " does not exist, so nothing can be said about what ran.");
              process.exit(1);
            }
            const doc = JSON.parse(fs.readFileSync(report, "utf8"));
            const perFile = new Map();
            const visit = (node, file) => {
              if (node === null || typeof node !== "object") return;
              if (Array.isArray(node)) {
                for (const item of node) visit(item, file);
                return;
              }
              const current = typeof node.file === "string" ? node.file : file;
              if (Array.isArray(node.results) && current) {
                const ran = node.results.filter((r) => r && r.status && r.status !== "skipped").length;
                perFile.set(current, (perFile.get(current) ?? 0) + ran);
              }
              for (const value of Object.values(node)) visit(value, current);
            };
            visit(doc, null);
            const dir = path.join("apps", "web", "tests", "e2e", "authenticated");
            const specs = fs.readdirSync(dir).filter((name) => name.endsWith(".spec.ts")).sort();
            const normalise = (value) => String(value).split("\\").join("/");
            const rows = ["### Authenticated browser tier", "", "| Spec | Tests executed |", "| --- | --- |"];
            const silent = [];
            let total = 0;
            for (const name of specs) {
              const suffix = "authenticated/" + name;
              let count = 0;
              for (const [file, ran] of perFile) {
                if (normalise(file).endsWith(suffix)) count += ran;
              }
              total += count;
              if (count === 0) silent.push(name);
              rows.push("| `" + suffix + "` | " + count + " |");
            }
            rows.push("", "**" + total + "** test(s) executed across " + specs.length + " spec file(s).", "");
            fs.writeFileSync("authenticated-browser.md", rows.join("\n") + "\n");
            console.log(rows.join("\n"));
            if (total === 0) {
              console.log("::error::The authenticated tier executed ZERO tests. A green job that ran nothing is worse than the declared gap it replaced.");
              process.exit(1);
            }
            if (silent.length > 0) {
              console.log("::error::These authenticated specs contributed no executed test: " + silent.join(", "));
              process.exit(1);
            }
          '

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f authenticated-browser.md ]; then
            cat authenticated-browser.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-authenticated-browser
          retention-days: 30
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report.json
            authenticated-browser.md
            api.log
            api-ready.json

      - name: Stop the stack
        if: always()
        run: |
          set -euo pipefail
          # A stop that fails must not turn a green run red: the runner and every
          # container on it are destroyed either way, so this is tidiness rather
          # than a verdict. It is still reported.
          if npx --no-install supabase stop --no-backup; then
            echo 'stack stopped'
          else
            echo '::warning::supabase stop did not succeed; the runner is discarded regardless'
          fi

  protected-gate:
    name: protected-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - static-quality
      - web-quality
      - unit-tests-coverage
      - application-build
      - database-migration-replay
      - database-security
      - integration-tests
      - dependency-security
      - code-security
      - container-security
      - secret-scan
      - hosted-clean-room

    steps:
      # A local `uses: ./…` action is resolved from the workspace, which is
      # empty when a job starts — so the composite action below cannot be
      # found without this. Sparse and shallow on purpose: it exists only to
      # make the action file present. The composite then performs the real
      # exact-head checkout and replaces the workspace.
      - name: Make the repository's own actions resolvable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-project
        with:
          install: 'false'

      - name: Collect every job's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence
          pattern: evidence-*

      - name: Evaluate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS_JSON}" > needs.json
          # On a protected branch there is no change detection and therefore no
          # legitimate skip. The synthetic classification requires EVERY job, so
          # a skip here is always a failure.
          node scripts/ci/protected-classification.mjs \
            --needs needs.json --out-classification classification.json --out-needs needs.json
          node scripts/ci/evaluate-ci-gate.mjs \
            --needs needs.json --classification classification.json --evidence evidence \
            --expected-sha "${COMMIT}" --actual-sha "$(git rev-parse HEAD)" \
            --markdown protected-gate.md --json protected-gate.json

      - name: Publish the summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f protected-gate.md ]; then cat protected-gate.md >> "${GITHUB_STEP_SUMMARY}"; fi

      - name: Upload the protected-branch decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-protected-gate
          # Longest PR-tier retention: this artifact is what a gate record cites.
          retention-days: 90
          if-no-files-found: warn
          path: |
            protected-gate.json
            protected-gate.md
            needs.json
            classification.json
