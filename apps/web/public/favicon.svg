<!-- CRM favicon.
     Built from the approved anchors: the navy #0F2742 ground with the green
     #1F6B52 mark. No third colour, no gradient, no text — a tab icon is read at
     16px and anything more becomes noise at that size.
     Replacing the brand replaces this file; nothing references its contents. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CRM">
  <rect width="32" height="32" rx="7" fill="#0F2742" />
  <path
    d="M21.5 11.4a7.2 7.2 0 1 0 0 9.2"
    fill="none"
    stroke="#1F6B52"
    stroke-width="3.4"
    stroke-linecap="round"
  />
  <circle cx="22.4" cy="16" r="2.1" fill="#1F6B52" />
</svg>
